<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>万米高空：鹈鹕骑行·始皇打螺丝·大圣巡航</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --panel-bg: rgba(15, 23, 42, 0.75);
      --accent: #f59e0b;
      --accent-glow: rgba(245, 158, 11, 0.4);
      --text: #f8fafc;
      --text-dim: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #090d16;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #stage-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #020617;
    }

    svg#main-svg {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 20px 30px rgba(0, 0, 0, 0.6));
    }

    /* Glassmorphism Control Panel */
    .control-panel {
      position: absolute;
      top: 20px;
      left: 20px;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 16px 22px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      z-index: 50;
      max-width: 360px;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .panel-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #fbbf24;
      text-shadow: 0 0 12px rgba(251, 191, 36, 0.3);
    }

    .badge {
      font-size: 10px;
      background: rgba(245, 158, 11, 0.2);
      color: #f59e0b;
      padding: 2px 6px;
      border-radius: 6px;
      border: 1px solid rgba(245, 158, 11, 0.3);
      font-weight: 600;
    }

    .control-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #e2e8f0;
      padding: 7px 12px;
      font-size: 12px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      font-weight: 500;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-1px);
    }

    .btn.active {
      background: #f59e0b;
      color: #0f172a;
      border-color: #fbbf24;
      font-weight: 700;
      box-shadow: 0 0 14px var(--accent-glow);
    }

    .speed-slider-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: var(--text-dim);
    }

    .speed-slider {
      flex: 1;
      height: 4px;
      -webkit-appearance: none;
      appearance: none;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      outline: none;
    }

    .speed-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #f59e0b;
      cursor: pointer;
      box-shadow: 0 0 8px #f59e0b;
      transition: transform 0.15s;
    }

    .speed-slider::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    /* Dialogue Banner Bottom */
    .dialogue-box {
      position: absolute;
      bottom: 24px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(245, 158, 11, 0.3);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      padding: 12px 24px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      gap: 16px;
      z-index: 50;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      max-width: 80%;
    }

    .dialogue-box:hover {
      transform: translateY(-2px);
      border-color: rgba(245, 158, 11, 0.6);
      box-shadow: 0 12px 40px rgba(245, 158, 11, 0.2);
    }

    .avatar-tag {
      font-size: 13px;
      font-weight: 700;
      color: #0f172a;
      background: #f59e0b;
      padding: 4px 10px;
      border-radius: 20px;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(245, 158, 11, 0.4);
    }

    .dialogue-text {
      font-size: 14px;
      color: #f1f5f9;
      font-weight: 500;
      letter-spacing: 0.2px;
      transition: opacity 0.25s;
    }

    .dialogue-hint {
      font-size: 11px;
      color: var(--text-dim);
      white-space: nowrap;
    }

    /* Keyframe Animations inside CSS for SVG elements */
    @keyframes cloudDriftFast {
      0% { transform: translateX(0); }
      100% { transform: translateX(-1600px); }
    }

    @keyframes cloudDriftSlow {
      0% { transform: translateX(0); }
      100% { transform: translateX(-1600px); }
    }

    @keyframes speedLineLoop {
      0% { transform: translateX(1800px) skewX(-20deg); opacity: 0; }
      20% { opacity: 0.9; }
      80% { opacity: 0.9; }
      100% { transform: translateX(-400px) skewX(-20deg); opacity: 0; }
    }

    @keyframes planeHover {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      25% { transform: translate(-3px, -5px) rotate(-0.3deg); }
      50% { transform: translate(2px, 3px) rotate(0.2deg); }
      75% { transform: translate(-2px, -3px) rotate(-0.15deg); }
    }

    @keyframes pedalRotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes wheelSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-360deg); }
    }

    @keyframes wingFlapWave {
      0%, 100% { transform: rotate(0deg) scaleY(1); }
      50% { transform: rotate(1.5deg) scaleY(0.96); }
    }

    @keyframes drillVibrate {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(1px, -1px); }
      50% { transform: translate(-1.5px, 0.5px); }
      75% { transform: translate(1.5px, -0.5px); }
    }

    @keyframes crownTassels {
      0%, 100% { transform: rotate(0deg) skewX(0deg); }
      50% { transform: rotate(-8deg) skewX(5deg); }
    }

    @keyframes capeFlap {
      0%, 100% { transform: rotate(0deg) scaleX(1); }
      50% { transform: rotate(-3deg) scaleX(1.03); }
    }

    @keyframes wukongGaze {
      0%, 90%, 100% { opacity: 0.85; filter: drop-shadow(0 0 4px #fbbf24); }
      95% { opacity: 1; filter: drop-shadow(0 0 12px #f59e0b); }
    }

    @keyframes turbineGlow {
      0%, 100% { opacity: 0.75; }
      50% { opacity: 0.95; }
    }

    @keyframes sparkFlicker {
      0%, 100% { opacity: 0.9; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.6); }
    }

    @keyframes strobeBlink {
      0%, 88%, 94%, 100% { opacity: 0.1; }
      90%, 92% { opacity: 1; filter: drop-shadow(0 0 8px #ffffff); }
    }

    .anim-plane {
      animation: planeHover 3.2s ease-in-out infinite;
      transform-origin: 800px 500px;
    }

    .anim-wheel {
      animation: wheelSpin 0.35s linear infinite;
      transform-origin: center;
    }

    .anim-pedal {
      animation: pedalRotate 0.45s linear infinite;
      transform-origin: center;
    }

    .anim-drill {
      animation: drillVibrate 0.08s linear infinite;
      transform-origin: 1045px 540px;
    }

    .anim-crown-beads {
      animation: crownTassels 0.5s ease-in-out infinite alternate;
      transform-origin: 1045px 335px;
    }

    .anim-cape {
      animation: capeFlap 0.4s ease-in-out infinite alternate;
      transform-origin: 1030px 420px;
    }

    .anim-wukong-eyes {
      animation: wukongGaze 2.5s ease-in-out infinite;
    }

    .anim-turbine {
      animation: turbineGlow 1.2s ease-in-out infinite;
    }

    .anim-strobe {
      animation: strobeBlink 1.6s infinite;
    }

    .anim-spark {
      animation: sparkFlicker 0.1s ease-in-out infinite alternate;
    }

    /* Wing flutter */
    .pelican-left-wing {
      animation: wingFlapWave 0.7s ease-in-out infinite;
      transform-origin: 750px 550px;
    }
    .pelican-right-wing {
      animation: wingFlapWave 0.7s ease-in-out infinite 0.1s;
      transform-origin: 920px 550px;
    }

    /* Sound notification toast */
    .toast {
      position: absolute;
      top: 24px;
      right: 24px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 12px;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
      transform: translateY(-10px);
      transition: all 0.3s ease;
      pointer-events: none;
      z-index: 100;
    }
    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div id="stage-container">
    <!-- Main High-Definition Animated SVG -->
    <svg id="main-svg" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Gradients for Sky Themes -->
        <linearGradient id="sky-sunset" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#0b1026" />
          <stop offset="25%" stop-color="#2a1b4e" />
          <stop offset="50%" stop-color="#78295a" />
          <stop offset="70%" stop-color="#bf4343" />
          <stop offset="85%" stop-color="#ea7333" />
          <stop offset="100%" stop-color="#fdbb43" />
        </linearGradient>

        <linearGradient id="sky-day" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#0284c7" />
          <stop offset="40%" stop-color="#38bdf8" />
          <stop offset="75%" stop-color="#bae6fd" />
          <stop offset="100%" stop-color="#f0f9ff" />
        </linearGradient>

        <linearGradient id="sky-night" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#020617" />
          <stop offset="40%" stop-color="#090d21" />
          <stop offset="75%" stop-color="#141838" />
          <stop offset="100%" stop-color="#1e1b4b" />
        </linearGradient>

        <!-- Sun Glow -->
        <radialGradient id="sun-glow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fffbeb" stop-opacity="1" />
          <stop offset="30%" stop-color="#fde047" stop-opacity="0.8" />
          <stop offset="60%" stop-color="#f97316" stop-opacity="0.3" />
          <stop offset="100%" stop-color="#f97316" stop-opacity="0" />
        </radialGradient>

        <!-- Aircraft Metal Gradients -->
        <linearGradient id="plane-hull-grad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#f8fafc" />
          <stop offset="35%" stop-color="#cbd5e1" />
          <stop offset="70%" stop-color="#94a3b8" />
          <stop offset="100%" stop-color="#475569" />
        </linearGradient>

        <linearGradient id="wing-top-grad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#f1f5f9" />
          <stop offset="25%" stop-color="#e2e8f0" />
          <stop offset="60%" stop-color="#94a3b8" />
          <stop offset="100%" stop-color="#475569" />
        </linearGradient>

        <linearGradient id="engine-intake-grad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#1e293b" />
          <stop offset="30%" stop-color="#334155" />
          <stop offset="70%" stop-color="#0f172a" />
          <stop offset="100%" stop-color="#020617" />
        </linearGradient>

        <radialGradient id="jet-flame" cx="20%" cy="50%" r="80%">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="20%" stop-color="#67e8f9" />
          <stop offset="50%" stop-color="#0284c7" />
          <stop offset="80%" stop-color="#3b82f6" stop-opacity="0.4" />
          <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0" />
        </radialGradient>

        <!-- Cockpit Glass Gradient -->
        <linearGradient id="cockpit-glass" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85" />
          <stop offset="40%" stop-color="#0369a1" stop-opacity="0.75" />
          <stop offset="100%" stop-color="#082f49" stop-opacity="0.95" />
        </linearGradient>

        <!-- Gold / Emperor Gradients -->
        <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#fef08a" />
          <stop offset="40%" stop-color="#f59e0b" />
          <stop offset="80%" stop-color="#b45309" />
          <stop offset="100%" stop-color="#78350f" />
        </linearGradient>

        <linearGradient id="qin-robe-grad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#18181b" />
          <stop offset="50%" stop-color="#09090b" />
          <stop offset="100%" stop-color="#27272a" />
        </linearGradient>

        <!-- Polar Bear Fur Gradient -->
        <linearGradient id="bear-fur" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="60%" stop-color="#f1f5f9" />
          <stop offset="100%" stop-color="#cbd5e1" />
        </linearGradient>

        <!-- Pelican Feathers Gradient -->
        <linearGradient id="pelican-body" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="70%" stop-color="#f8fafc" />
          <stop offset="100%" stop-color="#e2e8f0" />
        </linearGradient>

        <linearGradient id="pelican-beak" x1="0%" y1="0%" x2="100%" y2="50%">
          <stop offset="0%" stop-color="#fbbf24" />
          <stop offset="40%" stop-color="#f97316" />
          <stop offset="100%" stop-color="#ea580c" />
        </linearGradient>

        <linearGradient id="pelican-pouch" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#fed7aa" />
          <stop offset="60%" stop-color="#fba575" />
          <stop offset="100%" stop-color="#f97316" />
        </linearGradient>

        <!-- Spark Gradient -->
        <radialGradient id="spark-glow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="40%" stop-color="#fde047" />
          <stop offset="75%" stop-color="#ea580c" />
          <stop offset="100%" stop-color="#ea580c" stop-opacity="0" />
        </radialGradient>

        <!-- Filters -->
        <filter id="glow-heavy" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur" />
          <feMerge>
            <feMergeNode in="blur" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>

        <filter id="glow-subtle" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur" />
          <feMerge>
            <feMergeNode in="blur" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>

        <filter id="spark-blur">
          <feGaussianBlur stdDeviation="1.5" />
        </filter>

        <!-- Pattern: Caution Stripes for Aircraft Wing -->
        <pattern id="caution-stripes" width="20" height="20" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
          <line x1="0" y1="0" x2="0" y2="20" stroke="#fbbf24" stroke-width="10" />
          <line x1="10" y1="0" x2="10" y2="20" stroke="#1e293b" stroke-width="10" />
        </pattern>
      </defs>

      <!-- ================= 1. SKY & BACKGROUND LAYER ================= -->
      <g id="sky-bg">
        <rect id="sky-rect" x="0" y="0" width="1600" height="900" fill="url(#sky-sunset)" />
        
        <!-- Giant Sun Setting on Horizon -->
        <circle id="setting-sun" cx="1350" cy="480" r="140" fill="url(#sun-glow)" opacity="0.85" />

        <!-- Distant Mountain Ranges (Earth Horizon Below) -->
        <path d="M 0,820 Q 300,760 650,810 T 1200,780 Q 1450,750 1600,820 L 1600,900 L 0,900 Z" fill="#2d1537" opacity="0.7" />
        <path d="M 0,850 Q 400,810 850,845 T 1600,830 L 1600,900 L 0,900 Z" fill="#1b0c26" opacity="0.9" />

        <!-- Animated Parallax Cloud Layers (SVG native + CSS drift) -->
        <g id="cloud-layer-back" opacity="0.35">
          <!-- Back repeating clouds -->
          <g class="drift-slow">
            <path d="M -200,320 Q -150,280 -80,300 Q 0,260 70,290 Q 150,270 200,320 L 220,380 L -220,380 Z" fill="#fbcfe8" />
            <path d="M 300,240 Q 370,190 460,220 Q 540,180 620,220 Q 700,200 760,250 L 780,310 L 280,310 Z" fill="#fde047" opacity="0.6" />
            <path d="M 850,380 Q 920,330 1020,360 Q 1120,320 1200,360 Q 1280,330 1340,390 L 1360,450 L 830,450 Z" fill="#fda4af" />
            <path d="M 1400,280 Q 1460,240 1540,260 Q 1610,230 1680,265 T 1800,290 L 1800,360 L 1380,360 Z" fill="#fed7aa" />
          </g>
        </g>

        <!-- Midground High Speed Wind Streaks -->
        <g id="speed-lines" opacity="0.45">
          <line x1="1600" y1="120" x2="1100" y2="120" stroke="#ffffff" stroke-width="2" stroke-dasharray="140 40 80 120" stroke-linecap="round" style="animation: speedLineLoop 1.2s linear infinite;" />
          <line x1="1500" y1="260" x2="800" y2="260" stroke="#ffffff" stroke-width="3" stroke-dasharray="200 80 60 140" stroke-linecap="round" style="animation: speedLineLoop 0.85s linear infinite 0.2s;" />
          <line x1="1700" y1="410" x2="900" y2="410" stroke="#fde047" stroke-width="2.5" stroke-dasharray="160 50 120 70" stroke-linecap="round" style="animation: speedLineLoop 0.95s linear infinite 0.4s;" />
          <line x1="1650" y1="680" x2="700" y2="680" stroke="#ffffff" stroke-width="2" stroke-dasharray="180 90" stroke-linecap="round" style="animation: speedLineLoop 1.1s linear infinite 0.1s;" />
        </g>
      </g>

      <!-- ================= 2. GIANT AIRPLANE & WUKONG ================= -->
      <g id="airplane-world" class="anim-plane">
        
        <!-- Giant Turbofan Jet Engine Under Wing (Left bottom) -->
        <g id="jet-engine" transform="translate(180, 520)">
          <!-- Engine Pylon -->
          <path d="M 180,0 L 220,-80 L 260,-80 L 240,0 Z" fill="#475569" stroke="#334155" stroke-width="2" />
          
          <!-- Jet Exhaust Flame Core -->
          <ellipse cx="60" cy="70" rx="140" ry="32" fill="url(#jet-flame)" filter="url(#glow-heavy)" opacity="0.85" style="animation: turbineGlow 0.4s infinite alternate;" />
          <polygon points="60,45 -80,70 60,95" fill="#e0f2fe" opacity="0.6" filter="url(#glow-subtle)" />
          
          <!-- Nacelle Body -->
          <ellipse cx="220" cy="70" rx="150" ry="60" fill="url(#engine-intake-grad)" stroke="#64748b" stroke-width="3" />
          <!-- Engine Intake Cowl Ring -->
          <ellipse cx="330" cy="70" rx="35" ry="58" fill="#0f172a" stroke="#cbd5e1" stroke-width="5" />
          
          <!-- Spinning Fan Spinner & Blades -->
          <ellipse cx="330" cy="70" rx="15" ry="24" fill="#38bdf8" class="anim-turbine" />
          <path d="M 330,46 Q 315,70 330,94 M 320,52 Q 330,70 340,88 M 340,52 Q 330,70 320,88" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
          
          <!-- Engine Details: Warning Stencil & Panel Lines -->
          <line x1="160" y1="30" x2="160" y2="110" stroke="#475569" stroke-width="2" />
          <line x1="240" y1="20" x2="240" y2="120" stroke="#475569" stroke-width="2" />
          <rect x="200" y="60" width="30" height="14" fill="#dc2626" rx="2" />
          <text x="215" y="70" fill="#ffffff" font-size="7" font-weight="bold" text-anchor="middle" letter-spacing="1">DANGER</text>
        </g>

        <!-- Huge Main Wing Extending Horizontally -->
        <g id="main-wing">
          <!-- Lower wing underbelly shadow -->
          <path d="M 0,550 L 520,490 L 1520,620 L 1520,670 L 1200,720 L 0,690 Z" fill="#334155" opacity="0.8" />

          <!-- Main Wing Top Aerodynamic Surface -->
          <path d="M 0,520 L 540,470 L 1540,610 L 1500,660 L 680,680 L 0,660 Z" fill="url(#wing-top-grad)" stroke="#64748b" stroke-width="2" />

          <!-- Wing Seam Panels and Rivet Lines -->
          <line x1="450" y1="480" x2="520" y2="675" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 3" />
          <line x1="720" y1="505" x2="790" y2="675" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 3" />
          <line x1="990" y1="535" x2="1060" y2="670" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 3" />
          <line x1="1260" y1="575" x2="1310" y2="665" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 3" />
          
          <!-- Wing Caution Walkway & "NO STEP" Zone -->
          <polygon points="560,530 1420,640 1400,665 540,555" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="14 8" />
          <rect x="700" y="550" width="140" height="12" fill="url(#caution-stripes)" opacity="0.85" rx="2" />

  <script>
    // --- 1. Audio Synthesizer (Pure Web Audio API - Zero External Dependencies) ---
    let audioCtx = null;
    let engineGain = null;
    let drillGain = null;
    let isAudioRunning = false;
    let isTurbo = false;

    function initAudio() {
      if (audioCtx) return;
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();

      // Jet Engine Ambient Rumble (Lowpass pink noise)
      const bufferSize = audioCtx.sampleRate * 2;
      const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const output = noiseBuffer.getChannelData(0);
      let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
      for (let i = 0; i < bufferSize; i++) {
        const white = Math.random() * 2 - 1;
        b0 = 0.99886 * b0 + white * 0.0555179;
        b1 = 0.99332 * b1 + white * 0.0750759;
        b2 = 0.96900 * b2 + white * 0.1538520;
        b3 = 0.86650 * b3 + white * 0.3104856;
        b4 = 0.55000 * b4 + white * 0.5329522;
        b5 = -0.7616 * b5 - white * 0.0168980;
        output[i] = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
        output[i] *= 0.11;
        b6 = white * 0.115926;
      }

      const whiteNoise = audioCtx.createBufferSource();
      whiteNoise.buffer = noiseBuffer;
      whiteNoise.loop = true;

      const engineFilter = audioCtx.createBiquadFilter();
      engineFilter.type = 'lowpass';
      engineFilter.frequency.setValueAtTime(140, audioCtx.currentTime);

      engineGain = audioCtx.createGain();
      engineGain.gain.setValueAtTime(0.35, audioCtx.currentTime);

      whiteNoise.connect(engineFilter);
      engineFilter.connect(engineGain);
      engineGain.connect(audioCtx.destination);
      whiteNoise.start();

      // Electric Drill Whine (Sawtooth Oscillator with subtle mod)
      const drillOsc = audioCtx.createOscillator();
      drillOsc.type = 'sawtooth';
      drillOsc.frequency.setValueAtTime(260, audioCtx.currentTime);

      const drillFilter = audioCtx.createBiquadFilter();
      drillFilter.type = 'bandpass';
      drillFilter.frequency.setValueAtTime(1200, audioCtx.currentTime);
      drillFilter.Q.setValueAtTime(3.0, audioCtx.currentTime);

      drillGain = audioCtx.createGain();
      drillGain.gain.setValueAtTime(0.08, audioCtx.currentTime);

      drillOsc.connect(drillFilter);
      drillFilter.connect(drillGain);
      drillGain.connect(audioCtx.destination);
      drillOsc.start();
    }

    function toggleAudio() {
      const btn = document.getElementById('btn-audio');
      if (!isAudioRunning) {
        if (!audioCtx) initAudio();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        if (engineGain) engineGain.gain.setTargetAtTime(0.35, audioCtx.currentTime, 0.1);
        if (drillGain) drillGain.gain.setTargetAtTime(0.08, audioCtx.currentTime, 0.1);
        isAudioRunning = true;
        btn.classList.add('active');
        btn.textContent = '🔊 音效模拟: 开';
        showToast('已启动航空引擎与电钻音效合成');
      } else {
        if (engineGain) engineGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1);
        if (drillGain) drillGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1);
        isAudioRunning = false;
        btn.classList.remove('active');
        btn.textContent = '🔈 音效模拟: 关';
        showToast('音效已静音');
      }
    }

    // Bicycle Bell Ring sound effect
    function ringBell() {
      if (!audioCtx || !isAudioRunning) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(2200, now);
      osc.frequency.exponentialRampToValueAtTime(1800, now + 0.4);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.5);
    }

    // --- 2. Interactive Dialogues (Characters) ---
    const dialogues = [
      {
        speaker: "秦始皇",

    let currentDialogueIdx = 0;
    function nextDialogue() {
      currentDialogueIdx = (currentDialogueIdx + 1) % dialogues.length;

    // --- 3. Sky Theme Switcher ---
    function setTheme(theme) {
      document.querySelectorAll('#btn-sunset, #btn-day, #btn-night').forEach(b => b.classList.remove('active'));
      const skyRect = document.getElementById('sky-rect');
      const sun = document.getElementById('setting-sun');

        document.getElementById('btn-sunset').classList.add('active');
        skyRect.setAttribute('fill', 'url(#sky-sunset)');
        sun.style.display = 'block';
        showToast('已切换至：暮色晚霞模式');
      } else if (theme === 'day') {
        document.getElementById('btn-day').classList.add('active');
        skyRect.setAttribute('fill', 'url(#sky-day)');
        sun.style.display = 'none';
        showToast('已切换至：碧海长空模式');
      } else if (theme === 'night') {
        document.getElementById('btn-night').classList.add('active');
        skyRect.setAttribute('fill', 'url(#sky-night)');
        sun.style.display = 'none';
        showToast('已切换至：极光星夜模式');
      }
    }

    // --- 4. Speed & Turbo Control ---
    function updateSpeed(val) {
      document.getElementById('speed-label').textContent = parseFloat(val).toFixed(1) + 'x';
      const root = document.querySelector(':root');
      
      // Update keyframe animation speeds proportionally
      const wheels = document.querySelectorAll('.anim-wheel');
      wheels.forEach(w => w.style.animationDuration = (0.35 / val) + 's');

      const pedals = document.querySelectorAll('.anim-pedal');
      pedals.forEach(p => p.style.animationDuration = (0.45 / val) + 's');

      const speedLines = document.querySelectorAll('#speed-lines line, #foreground-speed-lines line');
      speedLines.forEach(l => l.style.animationDuration = (0.8 / val) + 's');

      if (audioCtx && isAudioRunning && drillGain) {
        drillGain.gain.setValueAtTime(0.06 * val, audioCtx.currentTime);
      }
    }

    function toggleTurbo() {
      const btn = document.getElementById('btn-turbo');
      isTurbo = !isTurbo;
      if (isTurbo) {
        btn.classList.add('active');
        btn.textContent = '🔥 极速狂飙: 开启';
        document.getElementById('speed-slider').value = 2.5;
        updateSpeed(2.5);
        showToast('航速突破 2.5 马赫！');
      } else {
        btn.classList.remove('active');
        btn.textContent = '⚡ 极速狂飙';
        document.getElementById('speed-slider').value = 1.0;
        updateSpeed(1.0);
        showToast('恢复平稳巡航时速');

    }

    // --- 5. Mega Sparks Effect ---
    function triggerMegaSpark() {
      const sparkGroup = document.getElementById('spark-burst');
      if (!sparkGroup) return;

      // Add extra dynamic sparks
      for (let i = 0; i < 8; i++) {
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        const angle = Math.random() * Math.PI * 1.2 - 0.4;
        const len = 30 + Math.random() * 45;
        const x2 = 78 + Math.cos(angle) * len;
        const y2 = 18 + Math.sin(angle) * len;

        line.setAttribute('x1', '78');
        line.setAttribute('y1', '18');
        line.setAttribute('x2', x2);
        line.setAttribute('y2', y2);
        line.setAttribute('stroke', '#ffffff');
        line.setAttribute('stroke-width', '2.5');
        line.setAttribute('stroke-linecap', 'round');
        sparkGroup.appendChild(line);

        setTimeout(() => line.remove(), 250);
      }

      showToast('⚡ 强力扭矩紧固！火花激射！');
    }

    // --- 6. Fullscreen & SVG Export ---
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
        showToast('已进入全屏沉浸模式');
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        showToast('已退出全屏模式');
      }
    }

    function downloadSVG() {
      const svg = document.getElementById('main-svg');
      const serializer = new XMLSerializer();
      let source = serializer.serializeToString(svg);

      // Add name spaces
      if (!source.match(/^<svg[^>]+xmlns="http\:\/\/www\.w3\.org\/2000\/svg"/)) {
        source = source.replace(/^<svg/, '<svg xmlns="http://www.w3.org/2000/svg"');
      }

      const svgBlob = new Blob([source], { type: 'image/svg+xml;charset=utf-8' });
      const svgUrl = URL.createObjectURL(svgBlob);
      const downloadLink = document.createElement('a');
      downloadLink.href = svgUrl;
      downloadLink.download = 'pelican_wukong_emperor.svg';
      document.body.appendChild(downloadLink);
      downloadLink.click();
      document.body.removeChild(downloadLink);
      showToast('已导出纯矢量 SVG 图片文件！');
    }

    // --- 7. Toast Notification Helper ---
    let toastTimeout = null;
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => t.classList.remove('show'), 2200);
    }

    // First user gesture listener to unblock Web Audio if clicked anywhere
    window.addEventListener('click', () => {
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }, { once: true });
  </script>
</body>
