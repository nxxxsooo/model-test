<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>齐天号×大秦重工 — 高空机翼打螺丝奇观 (2D SVG Animation)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
  <style>
    :root {
      --speed: 1;
      --play-state: running;
    }

    body {
      font-family: 'Noto Sans SC', sans-serif;
      background: #070b19;
      overflow: hidden;
      user-select: none;
    }

    .font-comic {
      font-family: 'ZCOOL KuaiLe', 'Noto Sans SC', cursive, sans-serif;
    }

    /* High altitude cloud & wind animations controlled by --speed */
    @keyframes moveLeftFast {
      0% { transform: translateX(1400px); }
      100% { transform: translateX(-600px); }
    }

    @keyframes moveLeftSlow {
      0% { transform: translateX(1400px); }
      100% { transform: translateX(-800px); }
    }

    @keyframes windStreak {
      0% { transform: translateX(1500px) scaleX(1); opacity: 0; }
      15% { opacity: 0.75; }
      85% { opacity: 0.75; }
      100% { transform: translateX(-700px) scaleX(1.3); opacity: 0; }
    }

    @keyframes planeHover {
      0%, 100% { transform: translateY(0px) rotate(-0.4deg); }
      50% { transform: translateY(-9px) rotate(0.5deg); }
    }

    @keyframes jetFlamePulse {
      0%, 100% { transform: scaleX(1) scaleY(1); opacity: 0.92; }
      50% { transform: scaleX(1.28) scaleY(1.08); opacity: 1; }
    }

    @keyframes wukongBlink {
      0%, 92%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(0.08); }
    }

    @keyframes bearBlink {
      0%, 88%, 100% { transform: scaleY(1); }
      92% { transform: scaleY(0.1); }
    }

    @keyframes crownBeadSway {
      0%, 100% { transform: rotate(14deg); }
      50% { transform: rotate(28deg); }
    }

    @keyframes capeFlutter {
      0%, 100% { transform: skewY(-2deg) scaleX(1); }
      50% { transform: skewY(4deg) scaleX(1.06); }
    }

    @keyframes sparkPop {
      0% { transform: scale(0.2) rotate(0deg); opacity: 1; }
      70% { transform: scale(1.35) rotate(35deg); opacity: 0.95; }
      100% { transform: scale(1.7) rotate(60deg); opacity: 0; }
    }

    .anim-cloud-slow {
      animation: moveLeftSlow calc(26s / var(--speed)) linear infinite;
      animation-play-state: var(--play-state);
    }
    .anim-cloud-mid {
      animation: moveLeftFast calc(14s / var(--speed)) linear infinite;
      animation-play-state: var(--play-state);
    }
    .anim-cloud-fast {
      animation: moveLeftFast calc(7.5s / var(--speed)) linear infinite;
      animation-play-state: var(--play-state);
    }
    .anim-wind {
      animation: windStreak calc(1.6s / var(--speed)) linear infinite;
      animation-play-state: var(--play-state);
    }
    .anim-plane {
      animation: planeHover calc(3.2s / var(--speed)) ease-in-out infinite;
      animation-play-state: var(--play-state);
      transform-origin: 650px 580px;
    }
    .anim-flame {
      animation: jetFlamePulse calc(0.14s / var(--speed)) ease-in-out infinite;
      animation-play-state: var(--play-state);
    }
    .anim-wukong-eye {
      animation: wukongBlink 3.6s infinite;
      animation-play-state: var(--play-state);
      transform-box: fill-box;
      transform-origin: center;
    }
    .anim-bear-eye {
      animation: bearBlink 4.5s infinite;
      animation-play-state: var(--play-state);
      transform-box: fill-box;
      transform-origin: center;
    }
    .anim-beads {
      animation: crownBeadSway calc(0.28s / var(--speed)) ease-in-out infinite;
      animation-play-state: var(--play-state);
      transform-box: fill-box;
      transform-origin: top center;
    }
    .anim-cape {
      animation: capeFlutter calc(0.35s / var(--speed)) ease-in-out infinite;
      animation-play-state: var(--play-state);
      transform-box: fill-box;
      transform-origin: left center;
    }

    /* Berserk 5x visual overdrive glow */
    .berserk-glow {
      filter: drop-shadow(0 0 14px rgba(251, 191, 36, 0.85));
    }

    /* Smooth camera viewport transition */
    #cameraGroup {
      transition: transform 0.65s cubic-bezier(0.22, 1, 0.36, 1);
    }
  </style>
</head>

<body class="w-screen h-screen flex flex-col justify-between relative overflow-hidden bg-slate-950 text-white">

  <!-- Top Telemetry & Story Header HUD -->
  <header class="z-20 w-full px-3 sm:px-6 pt-3 pb-2 flex flex-wrap items-center justify-between gap-2 pointer-events-none">
    <div class="flex items-center gap-3 bg-slate-900/80 backdrop-blur-md border border-amber-500/40 rounded-2xl px-4 py-2 shadow-xl pointer-events-auto">
      <div class="w-3 h-3 rounded-full bg-amber-400 animate-ping"></div>
      <div>
        <div class="flex items-center gap-2">
          <span class="text-xs font-bold tracking-widest uppercase px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 border border-amber-400/30">筋斗云航空 × 大秦重工</span>
          <span id="modeBadge" class="text-xs font-bold px-2 py-0.5 rounded bg-sky-500/20 text-sky-300 border border-sky-400/30">1x 标准巡航</span>
        </div>
        <h1 class="text-sm sm:text-base font-black tracking-wide text-slate-100 mt-0.5">
          悟空开飞机 · 鹈鹕踩单车 · 翅托北极熊 · 始皇打螺丝
        </h1>
      </div>
    </div>

    <!-- Real-time Telemetry Counters -->
    <div class="flex items-center gap-2 sm:gap-3 bg-slate-900/80 backdrop-blur-md border border-slate-700/80 rounded-2xl px-3.5 py-2 shadow-xl pointer-events-auto text-xs">
      <div class="px-2 border-r border-slate-700/80">
        <div class="text-slate-400 text-[10px]">空速 / 高度</div>
        <div class="font-mono font-bold text-sky-300"><span id="hudSpeed">880</span> km/h · 12,000m</div>
      </div>
      <div class="px-2 border-r border-slate-700/80">
        <div class="text-slate-400 text-[10px]">鹈鹕踏频</div>
        <div class="font-mono font-bold text-emerald-300"><span id="hudRpm">90</span> RPM</div>
      </div>
      <div class="px-2">
        <div class="text-amber-300/90 text-[10px] font-semibold">始皇累计打螺丝</div>
        <div class="font-mono font-black text-amber-400 text-sm"><span id="hudBolts">1,024</span> 颗</div>
      </div>
    </div>
  </header>

  <!-- Main 2D Animated SVG Stage -->
  <main class="absolute inset-0 w-full h-full flex items-center justify-center z-10">
    <svg id="sceneSvg" viewBox="0 0 1400 900" preserveAspectRatio="xMidYMid slice" class="w-full h-full">
      <defs>
        <!-- Sky Background Gradient -->
        <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#0c2461" />
          <stop offset="32%" stop-color="#1e5799" />
          <stop offset="68%" stop-color="#38ada9" />
          <stop offset="100%" stop-color="#82ccdd" />
        </linearGradient>

        <!-- Berserk Sky Overlay -->
        <linearGradient id="berserkSkyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#450a0a" stop-opacity="0.55" />
          <stop offset="50%" stop-color="#78350f" stop-opacity="0.35" />
          <stop offset="100%" stop-color="#b45309" stop-opacity="0.2" />
        </linearGradient>

        <!-- Aircraft Fuselage Metallic Gradient -->
        <linearGradient id="fuselageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="45%" stop-color="#f1f5f9" />
          <stop offset="72%" stop-color="#cbd5e1" />
          <stop offset="100%" stop-color="#64748b" />
        </linearGradient>

        <!-- Aircraft Wing Metallic Surface -->
        <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#f8fafc" />
          <stop offset="40%" stop-color="#e2e8f0" />
          <stop offset="80%" stop-color="#94a3b8" />
          <stop offset="100%" stop-color="#475569" />
        </linearGradient>

        <!-- Gold Trim Gradient -->
        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#fef08a" />
          <stop offset="35%" stop-color="#facc15" />
          <stop offset="70%" stop-color="#ca8a04" />
          <stop offset="100%" stop-color="#854d0e" />
        </linearGradient>

        <!-- Cockpit Glass Canopy Gradient -->
        <linearGradient id="canopyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.65" />
          <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.22" />
          <stop offset="85%" stop-color="#0284c7" stop-opacity="0.35" />
          <stop offset="100%" stop-color="#0369a1" stop-opacity="0.55" />
        </linearGradient>

        <!-- Jet Exhaust Afterburner Gradient -->
        <linearGradient id="jetFlameGrad" x1="0%" y1="50%" x2="100%" y2="50%">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="20%" stop-color="#38bdf8" />
          <stop offset="50%" stop-color="#f59e0b" />
          <stop offset="85%" stop-color="#ef4444" stop-opacity="0.7" />
          <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
        </linearGradient>

        <!-- Pelican Throat Pouch Gradient -->
        <linearGradient id="pouchGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#fde047" />
          <stop offset="50%" stop-color="#fb923c" />
          <stop offset="100%" stop-color="#ea580c" />
        </linearGradient>

        <!-- Polar Bear Fur Shading -->
        <linearGradient id="bearFurGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="65%" stop-color="#f1f5f9" />
          <stop offset="100%" stop-color="#cbd5e1" />
        </linearGradient>

        <!-- Qin Imperial Robe Black-Gold Gradient -->
        <linearGradient id="qinRobeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#27272a" />
          <stop offset="55%" stop-color="#18181b" />
          <stop offset="100%" stop-color="#09090b" />
        </linearGradient>

        <!-- Glow Filter for Sparks & Thrusters -->
        <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="4" result="blur" />
          <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>

        <!-- Soft Drop Shadow for Layered Depth -->
        <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
          <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.38" />
        </filter>

        <!-- Reusable Cloud Symbol -->
        <g id="fluffyCloud">
          <path d="M 40 60 Q 10 60 10 40 Q 10 20 35 20 Q 45 -5 75 5 Q 105 -10 130 15 Q 160 10 170 35 Q 195 35 190 55 Q 190 65 165 65 Z" fill="#ffffff" opacity="0.88" />
          <path d="M 45 60 Q 25 60 25 45 Q 50 30 95 40 Q 140 30 175 50 Q 180 62 160 64 Z" fill="#e2e8f0" opacity="0.65" />
        </g>
      </defs>

      <g id="cameraGroup">
        <!-- 1. SKY BACKGROUND & SUN GLOW -->
        <rect x="0" y="0" width="1400" height="900" fill="url(#skyGrad)" />
        <rect id="berserkSkyOverlay" x="0" y="0" width="1400" height="900" fill="url(#berserkSkyGrad)" opacity="0" class="transition-opacity duration-500" />

        <!-- Distant Sun & Atmospheric Rings -->
        <g transform="translate(210, 145)">
          <circle cx="0" cy="0" r="140" fill="#fef9c3" opacity="0.12" />
          <circle cx="0" cy="0" r="90" fill="#fef08a" opacity="0.22" />
          <circle cx="0" cy="0" r="52" fill="#fffbeb" opacity="0.9" filter="url(#glowFilter)" />
        </g>

        <!-- Far Parallax Clouds -->
        <g opacity="0.45">
          <g class="anim-cloud-slow" style="animation-delay: -2s;">
            <use href="#fluffyCloud" x="0" y="90" transform="scale(1.3)" />
          </g>
          <g class="anim-cloud-slow" style="animation-delay: -11s;">
            <use href="#fluffyCloud" x="0" y="210" transform="scale(0.95)" />
          </g>
          <g class="anim-cloud-slow" style="animation-delay: -19s;">
            <use href="#fluffyCloud" x="0" y="65" transform="scale(1.6)" />
          </g>
        </g>

        <!-- Mid Parallax Clouds -->
        <g opacity="0.72">
          <g class="anim-cloud-mid" style="animation-delay: -1s;">
            <use href="#fluffyCloud" x="0" y="340" transform="scale(1.4)" />
          </g>
          <g class="anim-cloud-mid" style="animation-delay: -6.5s;">
            <use href="#fluffyCloud" x="0" y="130" transform="scale(1.15)" />
          </g>
          <g class="anim-cloud-mid" style="animation-delay: -10.5s;">
            <use href="#fluffyCloud" x="0" y="450" transform="scale(1.5)" />
          </g>
        </g>

        <!-- High-Altitude Wind Shear & Speed Lines (Behind Plane) -->
        <g id="windLinesBack">
          <rect x="0" y="120" width="240" height="3" rx="1.5" fill="#ffffff" class="anim-wind" style="animation-delay: -0.1s;" />
          <rect x="0" y="230" width="380" height="2" rx="1" fill="#e0f2fe" class="anim-wind" style="animation-delay: -0.7s;" />
          <rect x="0" y="310" width="290" height="4" rx="2" fill="#ffffff" class="anim-wind" style="animation-delay: -1.2s;" />
          <rect x="0" y="490" width="420" height="2.5" rx="1.2" fill="#bae6fd" class="anim-wind" style="animation-delay: -0.4s;" />
          <rect x="0" y="680" width="350" height="3" rx="1.5" fill="#ffffff" class="anim-wind" style="animation-delay: -0.9s;" />
          <rect x="0" y="790" width="260" height="2" rx="1" fill="#e0f2fe" class="anim-wind" style="animation-delay: -1.4s;" />
        </g>

        <!-- ============================================================== -->
        <!-- MASTER STACKED ASSEMBLY (All 4 Layers Flying Together)         -->
        <!-- ============================================================== -->
        <g id="masterStack" class="anim-plane">

          <!-- ------------------------------------------------------------ -->
          <!-- LAYER 1: SUN WUKONG PILOTING THE HEAVY JUMBO AIRCRAFT        -->
          <!-- ------------------------------------------------------------ -->
          <g id="aircraftLayer" filter="url(#dropShadow)">

            <!-- Far Side Starboard Wingtip (Behind Fuselage) -->
            <path d="M 480 650 L 790 540 L 845 540 L 620 660 Z" fill="#94a3b8" stroke="#475569" stroke-width="2.5" />
            <!-- Far Side Winglet -->
            <path d="M 790 540 L 825 495 L 850 495 L 845 540 Z" fill="#dc2626" stroke="#7f1d1d" stroke-width="2" />

            <!-- Rear Vertical Stabilizer (Tail Fin with Jindouyun Golden Cloud Emblem) -->
            <path d="M 1030 615 L 1245 430 L 1315 430 L 1230 635 Z" fill="url(#goldGrad)" stroke="#78350f" stroke-width="3" />
            <path d="M 1075 610 L 1250 455 L 1285 455 L 1210 625 Z" fill="#b91c1c" />
            <!-- Golden Cloud Emblem on Tail -->
            <path d="M 1190 535 Q 1175 535 1178 520 Q 1185 505 1202 512 Q 1218 498 1230 515 Q 1245 520 1235 535 Z" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="1.5" />

            <!-- Rear Horizontal Stabilizer -->
            <path d="M 1130 645 L 1335 615 L 1355 630 L 1180 665 Z" fill="#cbd5e1" stroke="#334155" stroke-width="2.5" />

            <!-- Main Heavy Aircraft Fuselage (Facing Left, Flying Left) -->
            <path d="M 95 695
                     C 95 640, 175 595, 290 582
                     L 485 582
                     C 560 582, 620 595, 700 598
                     L 1150 598
                     C 1235 598, 1295 620, 1320 642
                     C 1295 685, 1200 725, 1080 732
                     L 270 732
                     C 160 732, 95 718, 95 695 Z"
                  fill="url(#fuselageGrad)" stroke="#334155" stroke-width="3.5" />

            <!-- Red & Gold Imperial Cheatline Stripes Along Fuselage -->
            <path d="M 105 685 Q 190 675 320 675 L 1265 655 L 1250 672 L 320 692 Q 185 692 102 698 Z" fill="#dc2626" />
            <path d="M 118 698 Q 195 690 320 690 L 1245 672 L 1235 682 L 320 700 Q 190 700 115 705 Z" fill="url(#goldGrad)" />

            <!-- Nose Radome Cone -->
            <path d="M 95 695 C 95 662, 130 632, 175 614 C 182 652, 182 695, 172 726 C 125 722, 95 710, 95 695 Z" fill="#1e293b" stroke="#0f172a" stroke-width="2.5" />
            <path d="M 108 682 Q 130 655 162 638" stroke="#64748b" stroke-width="3" fill="none" stroke-linecap="round" />

            <!-- Passenger Windows & Airline Livery Title -->
            <g transform="translate(550, 628)">
              <text x="0" y="0" fill="#0f172a" font-size="21" font-weight="900" letter-spacing="4">筋斗云航空 · 齐天号</text>
              <text x="275" y="-2" fill="#b45309" font-size="13" font-weight="700" letter-spacing="1">JINDOUYUN HEAVY B-9999</text>
              <!-- Row of Cabin Windows -->
              <g transform="translate(0, 12)">
                <rect x="0" y="0" width="16" height="22" rx="8" fill="#0ea5e9" stroke="#334155" stroke-width="2" />
                <rect x="34" y="0" width="16" height="22" rx="8" fill="#0ea5e9" stroke="#334155" stroke-width="2" />
                <rect x="68" y="0" width="16" height="22" rx="8" fill="#0ea5e9" stroke="#334155" stroke-width="2" />
                <rect x="102" y="0" width="16" height="22" rx="8" fill="#0ea5e9" stroke="#334155" stroke-width="2" />
                <rect x="136" y="0" width="16" height="22" rx="8" fill="#0ea5e9" stroke="#334155" stroke-width="2" />
                <rect x="170" y="0" width="16" height="22" rx="8" fill="#0ea5e9" stroke="#334155" stroke-width="2" />
                <rect x="204" y="0" width="16" height="22" rx="8" fill="#0ea5e9" stroke="#334155" stroke-width="2" />
                <rect x="238" y="0" width="16" height="22" rx="8" fill="#0ea5e9" stroke="#334155" stroke-width="2" />
                <rect x="272" y="0" width="16" height="22" rx="8" fill="#0ea5e9" stroke="#334155" stroke-width="2" />
                <rect x="306" y="0" width="16" height="22" rx="8" fill="#0ea5e9" stroke="#334155" stroke-width="2" />
                <rect x="340" y="0" width="16" height="22" rx="8" fill="#0ea5e9" stroke="#334155" stroke-width="2" />
                <rect x="374" y="0" width="16" height="22" rx="8" fill="#0ea5e9" stroke="#334155" stroke-width="2" />
              </g>
            </g>

            <!-- ========================================================== -->
            <!-- PANORAMIC TRANSPARENT COCKPIT & PILOT SUN WUKONG           -->
            <!-- ========================================================== -->
            <g id="cockpitAndWukong">
              <!-- Cockpit Interior Backwall & Instrument Glare Shield -->
              <path d="M 210 605 C 235 510, 445 505, 495 595 Z" fill="#0f172a" stroke="#334155" stroke-width="3" />
              <!-- Glowing Avionics Radar Screen -->
              <rect x="225" y="568" width="42" height="28" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
              <circle cx="246" cy="582" r="9" fill="none" stroke="#34d399" stroke-width="1.2" />
              <line x1="246" y1="582" x2="253" y2="576" stroke="#6ee7b7" stroke-width="1.5" />

              <!-- Captain Seat -->
              <path d="M 385 538 L 405 538 L 395 602 L 365 602 Z" fill="#b91c1c" stroke="#450a0a" stroke-width="2" />

              <!-- RUYI JINGU BANG (如意金箍棒) Leaning Inside Cockpit -->
              <g transform="translate(432, 558) rotate(22)">
                <rect x="-7" y="-58" width="14" height="115" rx="5" fill="#dc2626" stroke="#450a0a" stroke-width="2" />
                <!-- Top Golden Hoop with Cloud Pattern -->
                <rect x="-8.5" y="-58" width="17" height="26" rx="3" fill="url(#goldGrad)" stroke="#78350f" stroke-width="1.5" />
                <line x1="-8" y1="-44" x2="8" y2="-44" stroke="#78350f" stroke-width="1.5" />
                <!-- Bottom Golden Hoop -->
                <rect x="-8.5" y="30" width="17" height="26" rx="3" fill="url(#goldGrad)" stroke="#78350f" stroke-width="1.5" />
                <!-- Inscription hint -->
                <line x1="0" y1="-22" x2="0" y2="20" stroke="#fef08a" stroke-width="2" stroke-dasharray="3 3" />
              </g>

              <!-- SUN WUKONG (孙悟空 - 齐天大圣机长) -->
              <g id="wukongPilot" transform="translate(335, 560)">
                <!-- Flowing Red Scarf / Cloak -->
                <path d="M 25 10 Q 75 2 95 16 Q 75 30 30 26 Z" fill="#ef4444" stroke="#7f1d1d" stroke-width="1.8" class="anim-cape" />

                <!-- Golden Chainmail & Tiger-Skin Flight Suit Torso -->
                <path d="M -18 42 L -8 5 L 32 5 L 40 42 Z" fill="url(#goldGrad)" stroke="#78350f" stroke-width="2" />
                <path d="M -6 12 L 28 12 L 32 38 L -10 38 Z" fill="#f59e0b" />
                <!-- Tiger Stripe Accent Collar -->
                <path d="M -8 5 Q 12 18 32 5" fill="none" stroke="#1e293b" stroke-width="3" />

                <!-- Wukong's Long Pheasant Tail Feathers (雉鸡翎 - Dynamic JS/CSS Sway) -->
                <g id="wukongFeathers" transform="translate(12, -32)">
                  <path id="feather1" d="M 0 0 Q 65 -38 135 -18" fill="none" stroke="#facc15" stroke-width="4.5" stroke-linecap="round" />
                  <path id="feather1Tip" d="M 60 -24 Q 100 -34 135 -18" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />
                  <path id="feather2" d="M 0 2 Q 72 -18 142 4" fill="none" stroke="#eab308" stroke-width="4" stroke-linecap="round" />
                  <path id="feather2Tip" d="M 70 -8 Q 110 -5 142 4" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round" />
                </g>

                <!-- Monkey Head & Fur -->
                <circle cx="8" cy="-12" r="22" fill="#d97706" stroke="#78350f" stroke-width="2" />
                <!-- Monkey Ear -->
                <ellipse cx="26" cy="-10" rx="6" ry="9" fill="#f59e0b" stroke="#78350f" stroke-width="1.8" />
                <!-- Iconic Peach-Shaped Face Patch -->
                <path d="M -13 -14 C -13 -26, 2 -28, 6 -18 C 10 -28, 20 -22, 16 -10 C 19 -2, 8 7, -4 5 C -14 3, -15 -6, -13 -14 Z"
                      fill="#fed7aa" stroke="#9a3412" stroke-width="1.5" />

                <!-- Fiery Golden Eyes (火眼金睛 with Blinking Animation) -->
                <g class="anim-wukong-eye">
                  <!-- Red eye shadow contour -->

        1x 巡航
      </button>
      <button data-speed="2" class="speed-btn px-3 py-2 rounded-xl text-xs sm:text-sm font-bold transition-all bg-slate-800 hover:bg-slate-700 text-slate-200">
        2x 加班冲刺
      </button>
      <button data-speed="5" class="speed-btn px-3.5 py-2 rounded-xl text-xs sm:text-sm font-black transition-all bg-slate-800 hover:bg-red-900/70 text-amber-300 border border-amber-500/40">
        🔥 5x 狂暴打螺丝
      </button>

      <div class="h-6 w-[1px] bg-slate-700 mx-1"></div>

      <button id="btnSound" class="flex items-center gap-1 px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-200 font-bold text-xs transition-all" title="开启/关闭电批与涡扇音效">
        <span id="soundIcon">🔇</span>
        <span id="soundLabel" class="hidden sm:inline">音效: 关</span>
      </button>
    </div>

    <!-- Right: Camera / Layer Inspection Presets -->
    <div class="flex flex-wrap items-center gap-1.5 bg-slate-900/85 backdrop-blur-md border border-slate-700/80 rounded-2xl p-2 shadow-2xl pointer-events-auto">
      <span class="text-xs text-slate-400 font-semibold px-1.5 hidden lg:inline">镜头机位:</span>
      <button data-cam="full" class="cam-btn px-2.5 py-1.5 rounded-xl text-xs font-bold bg-sky-500 text-slate-950 transition-all">
        全景四层奇观
      </button>
      <button data-cam="qin" class="cam-btn px-2.5 py-1.5 rounded-xl text-xs font-bold bg-slate-800 hover:bg-slate-700 text-slate-200 transition-all">
        👑 秦皇骑熊打螺丝
      </button>
      <button data-cam="pelican" class="cam-btn px-2.5 py-1.5 rounded-xl text-xs font-bold bg-slate-800 hover:bg-slate-700 text-slate-200 transition-all">
        🦩 鹈鹕机翼踩单车
      </button>
      <button data-cam="wukong" class="cam-btn px-2.5 py-1.5 rounded-xl text-xs font-bold bg-slate-800 hover:bg-slate-700 text-slate-200 transition-all">
        🐵 悟空驾驶舱
      </button>
    </div>
  </footer>

  <script>
    (function () {
      // State Management
      let speedMultiplier = 1;
      let isPlaying = true;
      let lastTime = performance.now();
      let phase = 0;
      let boltCounter = 1024;
      let boltProgress = 0;
      let soundEnabled = false;
      let audioCtx = null;
      let lastSparkSoundTime = 0;

      // DOM Elements
      const rootStyle = document.documentElement.style;
      const hudSpeed = document.getElementById('hudSpeed');
      const hudRpm = document.getElementById('hudRpm');
      const hudBolts = document.getElementById('hudBolts');
      const modeBadge = document.getElementById('modeBadge');
      const berserkSkyOverlay = document.getElementById('berserkSkyOverlay');
      const cameraGroup = document.getElementById('cameraGroup');

      // SVG Animated Node References
      const turbineFans = document.querySelectorAll('.js-turbine-fan');
      const bikeWheels = document.querySelectorAll('.js-bike-wheel');
      const bikeChain = document.getElementById('bikeChain');

      // Pelican & Bicycle IK Nodes
      const pelicanGroup = document.getElementById('pelicanGroup');
      const pelicanWingsPlatform = document.getElementById('pelicanWingsPlatform');
      const pelicanPouchPath = document.getElementById('pelicanPouchPath');
      const leftCrankArm = document.getElementById('leftCrankArm');
      const rightCrankArm = document.getElementById('rightCrankArm');
      const leftPedalRect = document.getElementById('leftPedalRect');
      const rightPedalRect = document.getElementById('rightPedalRect');
      const leftLegBones = document.getElementById('leftLegBones');
      const rightLegBones = document.getElementById('rightLegBones');
      const leftFootWeb = document.getElementById('leftFootWeb');
      const rightFootWeb = document.getElementById('rightFootWeb');

      // Polar Bear & Qin Shi Huang Nodes
      const bearAndEmperorLayer = document.getElementById('bearAndEmperorLayer');
      const qinShiHuangGroup = document.getElementById('qinShiHuangGroup');
      const emperorRightArmAndTool = document.getElementById('emperorRightArmAndTool');
      const activeBoltGroup = document.getElementById('activeBoltGroup');
      const sparkBurstGroup = document.getElementById('sparkBurstGroup');
      const floatingFxText1 = document.getElementById('floatingFxText1');
      const floatingFxText2 = document.getElementById('floatingFxText2');
      const toolSpinRing = document.getElementById('toolSpinRing');

      // Sun Wukong Nodes
      const feather1 = document.getElementById('feather1');
      const feather1Tip = document.getElementById('feather1Tip');
      const feather2 = document.getElementById('feather2');
      const feather2Tip = document.getElementById('feather2Tip');
      const wukongYokeGroup = document.getElementById('wukongYokeGroup');

      /**
       * Solves 2-segment Inverse Kinematics (Hip -> Knee -> Foot on Pedal)
       * Ensures the Pelican's knees bend forward naturally toward the handlebars
       */
      function solveLegIK(hipX, hipY, footX, footY, L1, L2) {
        const dx = footX - hipX;
        const dy = footY - hipY;
        let dist = Math.hypot(dx, dy);
        const maxReach = L1 + L2 - 0.5;
        if (dist > maxReach) dist = maxReach;
        if (dist < Math.abs(L1 - L2) + 0.5) dist = Math.abs(L1 - L2) + 0.5;

        const baseAngle = Math.atan2(dy, dx);
        const cosAngle = (L1 * L1 + dist * dist - L2 * L2) / (2 * L1 * dist);
        const clampedCos = Math.max(-1, Math.min(1, cosAngle));
        const offsetAngle = Math.acos(clampedCos);

        // Bend knee forward (to the left, which is +offsetAngle in screen coordinates)
        const kneeAngle = baseAngle + offsetAngle;
        const kneeX = hipX + L1 * Math.cos(kneeAngle);
        const kneeY = hipY + L1 * Math.sin(kneeAngle);

        return { kneeX, kneeY };
      }

      function triggerScrewSound() {
        if (!soundEnabled) return;
        try {
          if (!audioCtx) {
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContextClass();
          }
          if (audioCtx.state === 'suspended') {
            audioCtx.resume();
          }
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          const baseFreq = 190 + Math.random() * 80 * speedMultiplier;
          osc.frequency.setValueAtTime(baseFreq, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.45, audioCtx.currentTime + 0.045);

          gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);

          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.055);
        } catch (err) {
          // Ignore audio errors if blocked by browser autoplay policy
        }
      }

      function animateLoop(now) {
        const dt = Math.min((now - lastTime) / 1000, 0.1);
        lastTime = now;

        if (isPlaying) {
          phase += dt * speedMultiplier;

          // 1. Rotate Jet Engine Turbine Fans & Bicycle Wheels
          const wheelAngle = -(phase * 340) % 360;
          const fanAngle = -(phase * 920) % 360;

          bikeWheels.forEach((wheel) => {
            wheel.setAttribute('transform', `rotate(${wheelAngle.toFixed(1)})`);
          });
          turbineFans.forEach((fan) => {
            fan.setAttribute('transform', `rotate(${fanAngle.toFixed(1)})`);
          });

          // Animate Bicycle Chain Dashoffset
          bikeChain.setAttribute('stroke-dashoffset', ((phase * 85) % 20).toFixed(1));

          // 2. Pelican Bicycle Crank & 2-Bone IK Pedaling Kinematics
          const crankCenterX = 695;
          const crankCenterY = 622;
          const crankRadius = 22;
          // Counter-clockwise rotation (since bike rides left)
          const crankRad = -phase * 6.2;

          // Near (Left) Pedal & Far (Right) Pedal 180 degrees apart
          const leftPedalX = crankCenterX + crankRadius * Math.cos(crankRad);
          const leftPedalY = crankCenterY + crankRadius * Math.sin(crankRad);
          const rightPedalX = crankCenterX + crankRadius * Math.cos(crankRad + Math.PI);
          const rightPedalY = crankCenterY + crankRadius * Math.sin(crankRad + Math.PI);

          // Update Crank Arms & Pedals
          leftCrankArm.setAttribute('x2', leftPedalX.toFixed(1));
          leftCrankArm.setAttribute('y2', leftPedalY.toFixed(1));
          leftPedalRect.setAttribute('x', (leftPedalX - 12).toFixed(1));
          leftPedalRect.setAttribute('y', (leftPedalY - 3.5).toFixed(1));

          rightCrankArm.setAttribute('x2', rightPedalX.toFixed(1));
          rightCrankArm.setAttribute('y2', rightPedalY.toFixed(1));
          rightPedalRect.setAttribute('x', (rightPedalX - 12).toFixed(1));
          rightPedalRect.setAttribute('y', (rightPedalY - 3.5).toFixed(1));

          // Pelican Body Bobbing in Rhythm with Pedaling
          const pelicanBobY = Math.sin(phase * 12.4) * 3.2;
          pelicanGroup.setAttribute('transform', `translate(0, ${pelicanBobY.toFixed(2)})`);

          // Pelican Throat Pouch Elastic Jiggle
          const pouchBounce = Math.sin(phase * 14) * 6;
          pelicanPouchPath.setAttribute(
            'd',
            `M 562 404 C 572 ${(456 + pouchBounce).toFixed(1)}, 635 ${(468 + pouchBounce).toFixed(1)}, 676 426 L 668 402 Z`
          );

          // Compute IK for Pelican Legs (Hip attaches to bobbing Pelican torso)
          const hipX = 722;
          const hipY = 520 + pelicanBobY;
          const leftIK = solveLegIK(hipX, hipY, leftPedalX, leftPedalY, 64, 64);
          const rightIK = solveLegIK(hipX, hipY, rightPedalX, rightPedalY, 64, 64);

          leftLegBones.setAttribute(
            'points',
            `${hipX.toFixed(1)},${hipY.toFixed(1)} ${leftIK.kneeX.toFixed(1)},${leftIK.kneeY.toFixed(1)} ${leftPedalX.toFixed(1)},${leftPedalY.toFixed(1)}`
          );
          rightLegBones.setAttribute(
            'points',
            `${hipX.toFixed(1)},${hipY.toFixed(1)} ${rightIK.kneeX.toFixed(1)},${rightIK.kneeY.toFixed(1)} ${rightPedalX.toFixed(1)},${rightPedalY.toFixed(1)}`
          );

          leftFootWeb.setAttribute(
            'd',
            `M ${(leftPedalX - 16).toFixed(1)} ${leftPedalY.toFixed(1)} L ${(leftPedalX + 10).toFixed(1)} ${leftPedalY.toFixed(1)} L ${(leftPedalX + 2).toFixed(1)} ${(leftPedalY - 9).toFixed(1)} Z`
          );
          rightFootWeb.setAttribute(
            'd',
            `M ${(rightPedalX - 16).toFixed(1)} ${rightPedalY.toFixed(1)} L ${(rightPedalX + 10).toFixed(1)} ${rightPedalY.toFixed(1)} L ${(rightPedalX + 2).toFixed(1)} ${(rightPedalY - 9).toFixed(1)} Z`
          );

          // 3. Pelican Load-Bearing Wings Flex & Polar Bear Balance Sway
          const wingFlexDeg = Math.sin(phase * 12.4 + 0.6) * 1.1;
          pelicanWingsPlatform.setAttribute('transform', `translate(715, 462) rotate(${wingFlexDeg.toFixed(2)}) translate(-715, -462)`);

          const bearBobY = pelicanBobY * 0.85 + Math.cos(phase * 12.4) * 2.2;
          const bearRockDeg = Math.sin(phase * 6.2) * 0.9;
          bearAndEmperorLayer.setAttribute(
            'transform',
            `translate(0, ${bearBobY.toFixed(2)}) translate(720, 450) rotate(${bearRockDeg.toFixed(2)}) translate(-720, -450)`
          );

          // 4. Qin Shi Huang Furiously Screwing Bolts (High-Frequency Impact Wrench)
          boltProgress = (boltProgress + dt * 2.2 * speedMultiplier) % 1;
          // Bolt sinks down from -14 to -4 as it gets screwed in
          const boltY = -14 + boltProgress * 10;
          activeBoltGroup.setAttribute('transform', `translate(74, ${boltY.toFixed(2)})`);

          // High-frequency impact vibration on Emperor's right arm & screwdriver
          const drillJitterY = Math.sin(phase * 55) * 2.4 + boltProgress * 8;
          const drillJitterX = Math.cos(phase * 70) * 1.1;
          emperorRightArmAndTool.setAttribute('transform', `translate(${drillJitterX.toFixed(2)}, ${drillJitterY.toFixed(2)})`);

          // Subtle torso recoil as Qin Shi Huang applies pressure
          const emperorTorsoRock = Math.sin(phase * 28) * 0.8;
          qinShiHuangGroup.setAttribute('transform', `translate(725, 290) rotate(${emperorTorsoRock.toFixed(2)}) translate(-725, -290)`);

          // Spin & Pulse Electric Sparks + Floating Comic Text
          const sparkScale = 0.75 + Math.abs(Math.sin(phase * 42)) * 0.75 * (speedMultiplier >= 5 ? 1.35 : 1);
          const sparkAngle = (phase * 480) % 360;
          sparkBurstGroup.setAttribute('transform', `scale(${sparkScale.toFixed(2)}) rotate(${sparkAngle.toFixed(1)})`);

          toolSpinRing.setAttribute('stroke-dashoffset', ((phase * 120) % 28).toFixed(1));

          const textBounce1 = Math.sin(phase * 14) * 5;
          const textBounce2 = Math.cos(phase * 18) * 6;
          floatingFxText1.setAttribute('transform', `translate(-85, ${(-45 + textBounce1).toFixed(1)}) rotate(-12)`);
          floatingFxText2.setAttribute('transform', `translate(-52, ${(-82 + textBounce2).toFixed(1)}) rotate(6)`);

          // Increment Bolt Counter & Trigger Optional Sound FX
          if (now - lastSparkSoundTime > 260 / speedMultiplier) {
            boltCounter += speedMultiplier >= 5 ? 3 : 1;
            hudBolts.textContent = boltCounter.toLocaleString();
            triggerScrewSound();
            lastSparkSoundTime = now;
          }

          // 5. Sun Wukong's Pheasant Crown Feathers & Aircraft Yoke Steering
          const fWave1 = Math.sin(phase * 10) * 10;
          const fWave2 = Math.cos(phase * 11.5) * 11;
          feather1.setAttribute('d', `M 0 0 Q 65 ${(-38 + fWave1 * 0.5).toFixed(1)} 135 ${(-18 + fWave1).toFixed(1)}`);
          feather1Tip.setAttribute('d', `M 60 ${(-24 + fWave1 * 0.4).toFixed(1)} Q 100 ${(-34 + fWave1 * 0.7).toFixed(1)} 135 ${(-18 + fWave1).toFixed(1)}`);
          feather2.setAttribute('d', `M 0 2 Q 72 ${(-18 + fWave2 * 0.5).toFixed(1)} 142 ${(4 + fWave2).toFixed(1)}`);
          feather2Tip.setAttribute('d', `M 70 ${(-8 + fWave2 * 0.4).toFixed(1)} Q 110 ${(-5 + fWave2 * 0.7).toFixed(1)} 142 ${(4 + fWave2).toFixed(1)}`);

          const yokeTilt = Math.sin(phase * 3.5) * 6;
          wukongYokeGroup.setAttribute('transform', `translate(-38, 28) rotate(${yokeTilt.toFixed(2)}) translate(38, -28)`);
        }

        requestAnimationFrame(animateLoop);
      }

      // Speed Mode Buttons (1x, 2x, 5x Berserk)
      const speedButtons = document.querySelectorAll('.speed-btn');
      speedButtons.forEach((btn) => {
        btn.addEventListener('click', () => {
          const newSpeed = parseFloat(btn.getAttribute('data-speed'));
          speedMultiplier = newSpeed;
          rootStyle.setProperty('--speed', String(newSpeed));

          // Update Button Active Styling
          speedButtons.forEach((b) => {
            b.className = 'speed-btn px-3 py-2 rounded-xl text-xs sm:text-sm font-bold transition-all bg-slate-800 hover:bg-slate-700 text-slate-200';
          });

          if (newSpeed === 5) {
            btn.className = 'speed-btn px-3.5 py-2 rounded-xl text-xs sm:text-sm font-black transition-all bg-gradient-to-r from-amber-500 to-red-500 text-slate-950 shadow-lg scale-105';
            modeBadge.textContent = '🔥 5x 大秦狂暴打螺丝模式';
            modeBadge.className = 'text-xs font-black px-2 py-0.5 rounded bg-red-500/30 text-amber-300 border border-amber-400';
            berserkSkyOverlay.setAttribute('opacity', '1');
            sparkBurstGroup.classList.add('berserk-glow');
          } else if (newSpeed === 2) {
            btn.className = 'speed-btn px-3 py-2 rounded-xl text-xs sm:text-sm font-bold transition-all bg-amber-500 text-slate-950 shadow-md';
            modeBadge.textContent = '⚡ 2x 加班冲刺模式';
            modeBadge.className = 'text-xs font-bold px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 border border-amber-400/30';
            berserkSkyOverlay.setAttribute('opacity', '0');
            sparkBurstGroup.classList.remove('berserk-glow');
          } else {
            btn.className = 'speed-btn px-3 py-2 rounded-xl text-xs sm:text-sm font-bold transition-all bg-amber-500 text-slate-950 shadow-md';
            modeBadge.textContent = '1x 标准巡航';
            modeBadge.className = 'text-xs font-bold px-2 py-0.5 rounded bg-sky-500/20 text-sky-300 border border-sky-400/30';
            berserkSkyOverlay.setAttribute('opacity', '0');
            sparkBurstGroup.classList.remove('berserk-glow');
          }

          // Update Telemetry Readouts
          hudSpeed.textContent = Math.round(880 * (newSpeed === 5 ? 2.5 : newSpeed)).toLocaleString();
          hudRpm.textContent = Math.round(90 * newSpeed);
        });
      });

      // Play / Pause Button
      const btnPlayPause = document.getElementById('btnPlayPause');
      const playPauseIcon = document.getElementById('playPauseIcon');
      const playPauseLabel = document.getElementById('playPauseLabel');

      btnPlayPause.addEventListener('click', () => {
        isPlaying = !isPlaying;
        rootStyle.setProperty('--play-state', isPlaying ? 'running' : 'paused');
        if (isPlaying) {
          playPauseIcon.textContent = '⏸';
          playPauseLabel.textContent = '暂停动画';
          btnPlayPause.className = 'flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-400 active:scale-95 text-slate-950 font-black text-xs sm:text-sm transition-all shadow-md';
        } else {
          playPauseIcon.textContent = '▶️';
          playPauseLabel.textContent = '继续播放';
          btnPlayPause.className = 'flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-amber-400 hover:bg-amber-300 active:scale-95 text-slate-950 font-black text-xs sm:text-sm transition-all shadow-md';
        }
      });

      // Sound Toggle Button
      const btnSound = document.getElementById('btnSound');
      const soundIcon = document.getElementById('soundIcon');
      const soundLabel = document.getElementById('soundLabel');

      btnSound.addEventListener('click', () => {
        soundEnabled = !soundEnabled;
        if (soundEnabled) {
          soundIcon.textContent = '🔊';
          soundLabel.textContent = '音效: 开';
          btnSound.className = 'flex items-center gap-1 px-3 py-2 rounded-xl bg-amber-500/20 border border-amber-400/50 text-amber-300 font-bold text-xs transition-all';
          triggerScrewSound();
        } else {
          soundIcon.textContent = '🔇';
          soundLabel.textContent = '音效: 关';
          btnSound.className = 'flex items-center gap-1 px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-xs transition-all';
        }
      });

      // Camera Focus Preset Buttons
      const camPresets = {
        full: 'translate(0px, 0px) scale(1)',
        qin: 'translate(-610px, -110px) scale(1.95)',
        pelican: 'translate(-630px, -480px) scale(1.9)',
        wukong: 'translate(-110px, -520px) scale(2.05)'
      };

      const camButtons = document.querySelectorAll('.cam-btn');
      camButtons.forEach((btn) => {
        btn.addEventListener('click', () => {
          const camKey = btn.getAttribute('data-cam');
          cameraGroup.style.transform = camPresets[camKey] || camPresets.full;

          camButtons.forEach((b) => {
            b.className = 'cam-btn px-2.5 py-1.5 rounded-xl text-xs font-bold bg-slate-800 hover:bg-slate-700 text-slate-200 transition-all';
          });
          btn.className = 'cam-btn px-2.5 py-1.5 rounded-xl text-xs font-bold bg-sky-500 text-slate-950 transition-all shadow-md';
        });
      });

      // Start the animation loop on window load
      window.onload = function () {
        lastTime = performance.now();
        requestAnimationFrame(animateLoop);
      };
    })();
  </script>
</body>
</html>
