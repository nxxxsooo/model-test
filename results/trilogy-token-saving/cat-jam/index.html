<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>鹈鹕骑自行车 · 孙悟空飞机机翼 · 秦始皇北极熊打螺丝</title>
<style>
  html,body{margin:0;padding:0;background:#0b1d3a;height:100%;}
  .stage{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 30%,#1e4a8a 0%,#07102a 100%);}
  svg{width:min(100vw,1600px);height:auto;max-height:100vh;filter:drop-shadow(0 20px 40px rgba(0,0,0,.4));}
</style>
</head>
<body>
<div class="stage">
<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ec6ff"/>
      <stop offset="0.55" stop-color="#bfe7ff"/>
      <stop offset="1" stop-color="#eaf6ff"/>
    </linearGradient>
    <linearGradient id="fuselage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f7fa"/>
      <stop offset="0.5" stop-color="#dfe3ea"/>
      <stop offset="1" stop-color="#b9c0cc"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9dde4"/>
      <stop offset="1" stop-color="#aeb6c4"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6c0"/>
      <stop offset="1" stop-color="#ffdd6b"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <!-- sun -->
  <circle cx="1320" cy="180" r="58" fill="url(#sun)" opacity="0.9"/>
  <!-- distant mountains / haze -->
  <path d="M0,720 Q200,640 420,700 T840,680 T1600,710 L1600,1000 L0,1000 Z" fill="#c7dcee" opacity="0.35"/>

  <!-- Clouds -->
  <g opacity="0.85">
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-260 0" dur="38s" repeatCount="indefinite"/>
      <ellipse cx="200" cy="150" rx="90" ry="34" fill="#fff"/>
      <ellipse cx="260" cy="138" rx="70" ry="28" fill="#fff"/>
      <ellipse cx="140" cy="138" rx="60" ry="26" fill="#fff"/>
    </g>
    <g transform="translate(900,40)">
      <animateTransform attributeName="transform" type="translate" from="900 40" to="640 40" dur="46s" repeatCount="indefinite"/>
      <ellipse cx="200" cy="150" rx="110" ry="38" fill="#fff"/>
      <ellipse cx="270" cy="136" rx="80" ry="30" fill="#fff"/>
      <ellipse cx="120" cy="140" rx="70" ry="28" fill="#fff"/>
    </g>
    <g transform="translate(500,80)">
      <animateTransform attributeName="transform" type="translate" from="500 80" to="240 80" dur="52s" repeatCount="indefinite"/>
      <ellipse cx="200" cy="160" rx="80" ry="26" fill="#fff" opacity="0.9"/>
      <ellipse cx="250" cy="150" rx="60" ry="22" fill="#fff" opacity="0.9"/>
    </g>
  </g>

  <!-- Airplane (Sun Wukong's jet) -->
  <g id="plane">
    <!-- tail fin -->
    <path d="M760,560 L700,300 L745,560 Z" fill="#cfd4dc" stroke="#8a92a2" stroke-width="2"/>
    <!-- horizontal stabilizer -->
    <rect x="670" y="548" width="130" height="14" rx="4" fill="#cfd4dc" stroke="#8a92a2" stroke-width="1.5"/>
    <!-- fuselage -->
    <ellipse cx="1050" cy="495" rx="300" ry="68" fill="url(#fuselage)" stroke="#8a92a2" stroke-width="2"/>
    <ellipse cx="1345" cy="495" rx="42" ry="66" fill="#e8ecf2" stroke="#8a92a2" stroke-width="2"/>
    <!-- windows -->
    <g fill="#87ceeb" stroke="#6a7180" stroke-width="1">
      <circle cx="820" cy="480" r="6"/>
      <circle cx="845" cy="480" r="6"/>
      <circle cx="870" cy="480" r="6"/>
      <circle cx="895" cy="480" r="6"/>
      <circle cx="920" cy="480" r="6"/>
      <circle cx="945" cy="480" r="6"/>
      <circle cx="970" cy="480" r="6"/>
      <circle cx="995" cy="480" r="6"/>
      <circle cx="1020" cy="480" r="6"/>
      <circle cx="1045" cy="480" r="6"/>
      <circle cx="1070" cy="480" r="6"/>
      <circle cx="1095" cy="480" r="6"/>
      <circle cx="1120" cy="480" r="6"/>
      <circle cx="1145" cy="480" r="6"/>
      <circle cx="1170" cy="480" r="6"/>
      <circle cx="1195" cy="480" r="6"/>
      <circle cx="1220" cy="480" r="6"/>
    </g>
    <!-- cockpit window -->
    <ellipse cx="1290" cy="472" rx="46" ry="40" fill="#87ceeb" stroke="#4a5060" stroke-width="3"/>
    <!-- Sun Wukong in cockpit -->
    <g transform="translate(1290,478)">
      <!-- face -->
      <circle cx="0" cy="0" r="20" fill="#d6a07a"/>
      <!-- golden headband -->
      <path d="M-20,-6 Q0,-14 20,-6" stroke="#ffd24d" stroke-width="4" fill="none"/>
      <circle cx="0" cy="-10" r="3" fill="#ffd24d"/>
      <!-- eyes -->
      <circle cx="-7" cy="-2" r="2.5" fill="#2b1a0e"/>
      <circle cx="7" cy="-2" r="2.5" fill="#2b1a0e"/>
      <!-- grin -->
      <path d="M-8,6 Q0,11 8,6" stroke="#2b1a0e" stroke-width="1.5" fill="none"/>
      <!-- red armor collars -->
      <path d="M-22,14 L-14,30 L14,30 L22,14 Z" fill="#c03030"/>
    </g>
    <!-- logo / marking -->
    <text x="1050" y="525" font-family="sans-serif" font-size="20" font-weight="bold" fill="#4a5060" text-anchor="middle" opacity="0.7">WUKONG AIR</text>
    <!-- wing -->
    <path d="M780,550 L120,620 L100,655 L770,585 Z" fill="url(#wing)" stroke="#8a92a2" stroke-width="2"/>
    <!-- wing rivet line -->
    <path d="M780,550 L120,620" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <g fill="#6a7180">
      <circle cx="680" cy="558" r="2"/>
      <circle cx="580" cy="566" r="2"/>
      <circle cx="480" cy="574" r="2"/>
      <circle cx="380" cy="582" r="2"/>
      <circle cx="280" cy="590" r="2"/>
      <circle cx="180" cy="598" r="2"/>
    </g>
    <!-- engine nacelle under wing -->
    <g>
      <ellipse cx="460" cy="690" rx="56" ry="34" fill="#9a9faa" stroke="#6a7180" stroke-width="2"/>
      <circle cx="460" cy="690" r="26" fill="#2a2f3a"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 460 690" to="360 460 690" dur="0.6s" repeatCount="indefinite"/>
        <line x1="460" y1="664" x2="460" y2="716" stroke="#b0b5c0" stroke-width="3"/>
        <line x1="434" y1="690" x2="486" y2="690" stroke="#b0b5c0" stroke-width="3"/>
        <line x1="442" y1="672" x2="478" y2="708" stroke="#b0b5c0" stroke-width="3"/>
        <line x1="478" y1="672" x2="442" y2="708" stroke="#b0b5c0" stroke-width="3"/>
      </g>
      <circle cx="460" cy="690" r="6" fill="#1a1f2a"/>
    </g>
  </g>

  <!-- Pelican + bike + bear + Qin group, rotated to follow wing slope -->
  <g transform="rotate(-6 475 582)">
    <!-- Bicycle -->
    <g id="bike">
      <!-- wheels -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 435 582" to="360 435 582" dur="0.9s" repeatCount="indefinite"/>
        <circle cx="435" cy="582" r="24" fill="#2b2b2b" stroke="#111" stroke-width="3"/>
        <circle cx="435" cy="582" r="18" fill="none" stroke="#888" stroke-width="1.5"/>
        <line x1="435" y1="564" x2="435" y2="600" stroke="#999" stroke-width="1"/>
        <line x1="417" y1="582" x2="453" y2="582" stroke="#999" stroke-width="1"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 515 582" to="360 515 582" dur="0.9s" repeatCount="indefinite"/>
        <circle cx="515" cy="582" r="24" fill="#2b2b2b" stroke="#111" stroke-width="3"/>
        <circle cx="515" cy="582" r="18" fill="none" stroke="#888" stroke-width="1.5"/>
        <line x1="515" y1="564" x2="515" y2="600" stroke="#999" stroke-width="1"/>
        <line x1="497" y1="582" x2="533" y2="582" stroke="#999" stroke-width="1"/>
      </g>
      <!-- frame -->
      <path d="M435,582 L475,548 L515,582 L475,582 Z" fill="none" stroke="#c03030" stroke-width="4" stroke-linejoin="round"/>
      <!-- seat post + seat -->
      <line x1="475" y1="548" x2="470" y2="538" stroke="#555" stroke-width="2"/>
      <ellipse cx="466" cy="536" rx="10" ry="4" fill="#333"/>
      <!-- handlebar stem + bar -->
      <line x1="515" y1="582" x2="505" y2="555" stroke="#555" stroke-width="2"/>
      <path d="M500,555 L516,550" stroke="#333" stroke-width="3" stroke-linecap="round"/>
      <!-- crank -->
      <circle cx="475" cy="582" r="6" fill="#333"/>
      <!-- pedals -->
      <line x1="475" y1="582" x2="468" y2="590" stroke="#333" stroke-width="2"/>
      <ellipse cx="466" cy="591" rx="6" ry="3" fill="#888"/>
      <line x1="475" y1="582" x2="482" y2="574" stroke="#333" stroke-width="2"/>
      <ellipse cx="484" cy="573" rx="6" ry="3" fill="#888"/>
    </g>

    <!-- Pelican -->
    <g id="pelican">
      <!-- wings (spread, forming cradle) -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="-3 475 555" to="3 475 555" dur="1.4s" repeatCount="indefinite" additive="sum"/>
        <!-- left wing -->
        <path d="M435,552 Q370,540 300,525 L295,535 Q365,552 435,564 Z" fill="#f3f3f3" stroke="#b9c0cc" stroke-width="1.5"/>
        <g stroke="#cbd3df" stroke-width="1">
          <line x1="420" y1="556" x2="310" y2="528"/>
          <line x1="400" y1="554" x2="330" y2="540"/>
        </g>
        <!-- right wing -->
        <path d="M515,552 Q580,540 650,525 L655,535 Q585,552 515,564 Z" fill="#f3f3f3" stroke="#b9c0cc" stroke-width="1.5"/>
        <g stroke="#cbd3df" stroke-width="1">
          <line x1="530" y1="556" x2="640" y2="528"/>
          <line x1="550" y1="554" x2="620" y2="540"/>
        </g>
      </g>
      <!-- body -->
      <ellipse cx="475" cy="550" rx="40" ry="26" fill="#f2f2f2" stroke="#b9c0cc" stroke-width="2"/>
      <!-- tail -->
      <path d="M436,546 L418,538 L422,556 Z" fill="#e2e2e2" stroke="#b9c0cc" stroke-width="1"/>
      <!-- neck + head -->
      <path d="M505,532 Q515,522 520,510" stroke="#dcdcdc" stroke-width="10" stroke-linecap="round" fill="none"/>
      <circle cx="522" cy="506" r="16" fill="#f4f4f4" stroke="#b9c0cc" stroke-width="2"/>
      <!-- beak -->
      <path d="M534,502 L595,512 L590,528 L532,516 Z" fill="#ff8c42" stroke="#c06020" stroke-width="1.5"/>
      <!-- pouch -->
      <path d="M532,516 Q565,540 590,528 Z" fill="#ffb07a" stroke="#c06020" stroke-width="1"/>
      <!-- eye -->
      <circle cx="525" cy="500" r="3" fill="#2b1a0e"/>
      <!-- legs to pedals -->
      <line x1="470" y1="574" x2="468" y2="590" stroke="#c06020" stroke-width="3" stroke-linecap="round"/>
      <line x1="482" y1="574" x2="484" y2="573" stroke="#c06020" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Polar bear standing on spread wings -->
    <g id="bear">
      <!-- hind legs -->
      <ellipse cx="448" cy="532" rx="11" ry="16" fill="#ffffff" stroke="#b8c6d8" stroke-width="1.5"/>
      <ellipse cx="502" cy="532" rx="11" ry="16" fill="#ffffff" stroke="#b8c6d8" stroke-width="1.5"/>
      <!-- body -->
      <ellipse cx="475" cy="500" rx="46" ry="34" fill="#ffffff" stroke="#b8c6d8" stroke-width="2"/>
      <!-- front legs -->
      <ellipse cx="446" cy="486" rx="10" ry="20" fill="#ffffff" stroke="#b8c6d8" stroke-width="1.5"/>
      <ellipse cx="504" cy="486" rx="10" ry="20" fill="#ffffff" stroke="#b8c6d8" stroke-width="1.5"/>
      <!-- head -->
      <circle cx="475" cy="466" r="22" fill="#ffffff" stroke="#b8c6d8" stroke-width="2"/>
      <!-- ears -->
      <circle cx="460" cy="450" r="6" fill="#ffffff" stroke="#b8c6d8" stroke-width="1.5"/>
      <circle cx="490" cy="450" r="6" fill="#ffffff" stroke="#b8c6d8" stroke-width="1.5"/>
      <!-- snout -->
      <ellipse cx="475" cy="470" rx="11" ry="7" fill="#f0eaff" stroke="#b8c6d8" stroke-width="1"/>
      <ellipse cx="475" cy="468" rx="4" ry="3" fill="#3a3a3a"/>
      <!-- eyes -->
      <circle cx="468" cy="462" r="2.5" fill="#2b1a0e"/>
      <circle cx="482" cy="462" r="2.5" fill="#2b1a0e"/>
      <!-- harness with screw point -->
      <rect x="470" y="492" width="28" height="10" rx="2" fill="#8a92a2" stroke="#555" stroke-width="1"/>
      <circle id="screw" cx="488" cy="497" r="5" fill="#ffd24d" stroke="#a07800" stroke-width="1"/>
      <line x1="488" y1="497" x2="488" y2="494" stroke="#6a5000" stroke-width="1.5">
        <animateTransform attributeName="transform" type="rotate" from="0 488 497" to="360 488 497" dur="1.2s" repeatCount="indefinite"/>
      </line>
    </g>

    <!-- Qin Shi Huang riding the bear, screwing -->
    <g id="qin">
      <!-- legs straddling bear -->
      <path d="M458,440 Q450,460 445,478" stroke="#7b2fbe" stroke-width="8" stroke-linecap="round" fill="none"/>
      <path d="M492,440 Q500,460 505,478" stroke="#7b2fbe" stroke-width="8" stroke-linecap="round" fill="none"/>
      <!-- boots -->
      <ellipse cx="444" cy="480" rx="7" ry="4" fill="#3a2a1a"/>
      <ellipse cx="506" cy="480" rx="7" ry="4" fill="#3a2a1a"/>
      <!-- robe body -->
      <ellipse cx="475" cy="432" rx="30" ry="34" fill="#7b2fbe" stroke="#4a1a7e" stroke-width="2"/>
      <path d="M445,428 L475,400 L505,428 Z" fill="#9a4fdf" stroke="#4a1a7e" stroke-width="1.5"/>
      <!-- gold trim -->
      <path d="M445,432 Q475,438 505,432" stroke="#ffd24d" stroke-width="2" fill="none"/>
      <rect x="473" y="400" width="4" height="32" fill="#ffd24d"/>
      <!-- arms -->
      <path d="M450,425 Q430,440 438,458" stroke="#7b2fbe" stroke-width="7" stroke-linecap="round" fill="none"/>
      <circle cx="438" cy="460" r="6" fill="#f5d0a9"/>
      <!-- right arm with screwdriver -->
      <path d="M500,425 Q522,432 532,455" stroke="#7b2fbe" stroke-width="7" stroke-linecap="round" fill="none"/>
      <circle cx="530" cy="457" r="6" fill="#f5d0a9"/>
      <g id="driver">
        <animateTransform attributeName="transform" type="rotate" from="-4 524 470" to="4 524 470" dur="0.6s" repeatCount="indefinite"/>
        <!-- handle -->
        <rect x="518" y="442" width="12" height="32" rx="3" fill="#3a2a1a"/>
        <!-- shaft -->
        <rect x="522" y="470" width="4" height="22" fill="#c0c0c0"/>
        <!-- tip -->
        <polygon points="520,492 528,492 525,498 523,498" fill="#707070"/>
      </g>
      <!-- head -->
      <circle cx="475" cy="395" r="17" fill="#f5d0a9" stroke="#c9a070" stroke-width="1.5"/>
      <!-- features -->
      <circle cx="469" cy="392" r="2" fill="#2b1a0e"/>
      <circle cx="481" cy="392" r="2" fill="#2b1a0e"/>
      <path d="M469,400 Q475,404 481,400" stroke="#2b1a0e" stroke-width="1.2" fill="none"/>
      <!-- beard -->
      <path d="M462,403 Q475,414 488,403" stroke="#3a2a1a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <!-- crown (Emperor) -->
      <path d="M455,376 L458,360 L466,372 L475,356 L484,372 L492,360 L495,376 Z" fill="#ffd24d" stroke="#a07800" stroke-width="2"/>
      <circle cx="475" cy="360" r="3" fill="#ff4d4d"/>
      <rect x="455" y="376" width="40" height="5" rx="2" fill="#ffd24d" stroke="#a07800" stroke-width="1.5"/>
    </g>
  </g>

  <!-- caption -->
  <text x="800" y="950" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" opacity="0.85" style="text-shadow:0 2px 6px rgba(0,0,0,.4)">
    鹈鹕骑自行车 · 飞翔于孙悟空的大型客机机翼 · 托举秦始皇的北极熊 · 打螺丝中
  </text>
</svg>
</div>
</body>
</html>
