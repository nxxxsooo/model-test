<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>高空重工 · 鹈鹕 × 孙悟空 × 秦始皇（2D 动画 SVG）</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: radial-gradient(130% 120% at 50% -10%, #16395f 0%, #0a1a2b 55%, #04080e 100%);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  }
  .wrap { width: min(1660px, 100vw); padding: clamp(0px, 1.4vw, 22px); }
  .stage {
    position: relative; border-radius: 18px; overflow: hidden;
    box-shadow: 0 34px 90px -34px rgba(0,0,0,.9), 0 0 0 1px rgba(255,255,255,.08);
  }
  svg { display: block; width: 100%; height: auto; }

  /* ---------- ambient motion ---------- */
  .flyer { animation: bob 4.6s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }

  .drift  { animation: drift 48s linear infinite; }
  .drift2 { animation: drift 84s linear infinite; }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-1600px); } }

  .streak { animation: streak 2.4s linear infinite; }
  @keyframes streak {
    0%   { transform: translateX(360px); opacity: 0; }
    12%  { opacity: .7; }
    82%  { opacity: .55; }
    100% { transform: translateX(-1780px); opacity: 0; }
  }

  .spark  { animation: spark .46s steps(2, end) infinite; }
  .spark2 { animation: spark .38s steps(2, end) infinite .16s; }
  .spark3 { animation: spark .54s steps(2, end) infinite .08s; }
  @keyframes spark {
    0%, 100% { opacity: 0; transform: scale(.35); }
    45%      { opacity: 1; transform: scale(1); }
  }
  .eyeGlow { animation: glow 1.7s ease-in-out infinite; }
  @keyframes glow { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }

  @media (prefers-reduced-motion: reduce) {
    .flyer, .drift, .drift2, .streak, .spark, .spark2, .spark3, .eyeGlow { animation: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="stage">
    <svg id="scene" viewBox="0 0 1600 920" role="img" aria-labelledby="ttl dsc">
      <title id="ttl">鹈鹕骑着自行车在孙悟空的大型飞机机翼上骑行，展开翅膀托着秦始皇的北极熊，秦始皇骑在熊上打螺丝</title>

          <stop offset="1" stop-color="#b9c9da"/>

        <linearGradient id="nacelle" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#e6edf4"/>
          <stop offset="1" stop-color="#93a5b6"/>

        <linearGradient id="glass" x1="0" y1="0" x2=".35" y2="1">

          <stop offset="1" stop-color="#93a3b2"/>

<script>
(function () {
  "use strict";
  var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var byId = function (id) { return document.getElementById(id); };

  var el = {
    wheelR: byId("wheelR"), wheelF: byId("wheelF"),
    fanA: byId("fanA"), fanB: byId("fanB"),
    bolt: byId("bolt"), bit: byId("bit"),
    crankFar: byId("crankFar"), crankNear: byId("crankNear"),
    pedalFar: byId("pedalFar"), pedalNear: byId("pedalNear"),
    legFar: byId("legFar"), legNear: byId("legNear"),
    footFar: byId("footFar"), footNear: byId("footNear")
  };

  /* --- drivetrain geometry --- */
  var BB = { x: 644, y: 566 };      // bottom bracket
  var R = 26;                       // crank radius
  var HIP_F = { x: 578, y: 456 };   // far hip
  var HIP_N = { x: 594, y: 462 };   // near hip
  var L1 = 80, L2 = 78;             // thigh / shin

  function knee(hip, foot) {
    var dx = foot.x - hip.x, dy = foot.y - hip.y;
    var raw = Math.sqrt(dx * dx + dy * dy) || 1;
    var d = raw;
    var hi = L1 + L2 - 0.5, lo = Math.abs(L1 - L2) + 0.5;
    if (d > hi) d = hi;
    if (d < lo) d = lo;
    var ux = dx / raw, uy = dy / raw;
    var a = (L1 * L1 - L2 * L2 + d * d) / (2 * d);
    var h = Math.sqrt(Math.max(0, L1 * L1 - a * a));
    var mx = hip.x + a * ux, my = hip.y + a * uy;
    var k1 = { x: mx - h * uy, y: my + h * ux };
    var k2 = { x: mx + h * uy, y: my - h * ux };
    return k1.x > k2.x ? k1 : k2;   // knee bends forward
  }

  function put(node, t) { if (node) node.setAttribute("transform", t); }
  function r2(n) { return Math.round(n * 100) / 100; }

  function render(t) {
    var rev = t * 0.9;                      // crank revolutions per second
    var th = rev * Math.PI * 2;

    var wa = rev * 1.85 * 360;              // wheel angle (gear ratio)
    put(el.wheelR, "rotate(" + r2(wa) + ")");
    put(el.wheelF, "rotate(" + r2(wa) + ")");
    put(el.fanA, "rotate(" + r2(t * 1250) + ")");
    put(el.fanB, "rotate(" + r2(t * 1250) + ")");
    put(el.bolt, "rotate(" + r2(-t * 720) + ")");
    put(el.bit, "rotate(" + r2(t * 1680) + ")");

    var pF = { x: BB.x + R * Math.cos(th), y: BB.y + R * Math.sin(th) };
    var pN = { x: BB.x + R * Math.cos(th + Math.PI), y: BB.y + R * Math.sin(th + Math.PI) };

    if (el.crankFar) { el.crankFar.setAttribute("x2", r2(pF.x)); el.crankFar.setAttribute("y2", r2(pF.y)); }
    if (el.crankNear) { el.crankNear.setAttribute("x2", r2(pN.x)); el.crankNear.setAttribute("y2", r2(pN.y)); }
    put(el.pedalFar, "translate(" + r2(pF.x) + " " + r2(pF.y) + ")");
    put(el.pedalNear, "translate(" + r2(pN.x) + " " + r2(pN.y) + ")");
    put(el.footFar, "translate(" + r2(pF.x) + " " + r2(pF.y) + ")");
    put(el.footNear, "translate(" + r2(pN.x) + " " + r2(pN.y) + ")");

    var kF = knee(HIP_F, pF), kN = knee(HIP_N, pN);
    if (el.legFar) el.legFar.setAttribute("d",
      "M" + HIP_F.x + " " + HIP_F.y + "L" + r2(kF.x) + " " + r2(kF.y) + "L" + r2(pF.x) + " " + r2(pF.y));
    if (el.legNear) el.legNear.setAttribute("d",
      "M" + HIP_N.x + " " + HIP_N.y + "L" + r2(kN.x) + " " + r2(kN.y) + "L" + r2(pN.x) + " " + r2(pN.y));
  }

  if (reduced) {
    render(0.35);                            // a single, still-but-posed frame
  } else {
    var start = null;
    var loop = function (now) {
      if (start === null) start = now;
      render((now - start) / 1000);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
