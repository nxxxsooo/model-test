<style>

*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111d;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;color:#eaf4ff}
button,input{font:inherit}
#app{height:100%;display:grid;grid-template-rows:auto 1fr auto}
header{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:15px 28px;background:#091522;border-bottom:1px solid var(--line)}

.stats{display:flex;align-items:center;gap:30px}
.stat small{display:block;font-size:10px;color:var(--muted);letter-spacing:2px;margin-bottom:5px}

#production{color:var(--gold)}
.gauge{display:flex;gap:12px;align-items:center}
.gauge svg{width:114px;height:66px}
.gauge b{font-size:21px;font-variant-numeric:tabular-nums}
.gauge small{display:block;font-size:10px;color:var(--muted)}
#weather{min-width:112px;font-size:12px}
#warning{margin-top:6px;color:#87d9c0;font-size:11px}
main{min-height:0;position:relative;background:#09192c}
#scene{width:100%;height:100%;display:block}
#mode{position:absolute;top:18px;left:26px;font-size:11px;letter-spacing:2px;color:#a7c6d5;border-left:2px solid #64cdb3;padding:7px 12px;background:#071724aa}
#mode.rage{color:#ffe19b;border-color:#ff704c;background:#532514cc;box-shadow:0 0 35px #ff6d2820}
#help{position:absolute;right:24px;top:18px;font-size:11px;color:#adc4d4;text-align:right;line-height:1.9}
#help b{color:#f2d395;font-weight:500}
#overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#03101a66;backdrop-filter:blur(3px);z-index:3}
#overlay.visible{display:flex}
.result{width:min(420px,90%);padding:35px;background:#0b1929ed;border:1px solid #e4b66566;box-shadow:0 25px 90px #0008;text-align:center}
.result small{letter-spacing:5px;color:var(--gold)}
.result h2{font-size:30px;margin:16px 0 9px}
.result p{font-size:13px;color:#a6bdcd;line-height:1.8}
.result strong{font-size:49px;color:var(--gold);font-variant-numeric:tabular-nums}
button{border:1px solid #f4ce7b70;background:#f4ce7b;color:#182030;border-radius:5px;padding:10px 18px;cursor:pointer;font-weight:750;transition:filter .15s}
button:hover{filter:brightness(1.12)}
button:active{transform:translateY(1px)}
.result button{display:block;margin:22px auto 0}
footer{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:13px 27px;background:#091522;border-top:1px solid var(--line);z-index:2}
.keys{font-size:11px;color:#92aebe;line-height:2}
kbd{font:11px system-ui;display:inline-block;color:#e5eff8;padding:1px 5px;border:1px solid #b4d4e02e;border-bottom-width:2px;border-radius:3px;background:#ffffff09}
.controls{display:flex;align-items:center;gap:21px}
label{font-size:11px;color:#b1c6d3;display:grid;grid-template-columns:auto auto;gap:6px 13px}
label output{color:var(--gold);text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{grid-column:1/3;width:135px;accent-color:var(--gold);height:13px;cursor:pointer}
#reset{font-size:12px;background:transparent;color:var(--gold)}
.touch{display:none;position:absolute;bottom:14px;gap:6px;z-index:2}
.touch.left{left:14px}.touch.right{right:14px}
.touch button{background:#0b2335dd;color:#f0d598;touch-action:none;padding:13px;border-color:#e8ce8b55;user-select:none}
@media(pointer:coarse){.touch{display:flex}}
@media(max-width:900px){header{padding:10px 13px;gap:10px}.brand small{letter-spacing:2px;font-size:8px}h1{font-size:14px}.stats{gap:13px}.stat strong{font-size:19px}.stat small{letter-spacing:0}.gauge svg{width:83px}.gauge{gap:3px}#weather{display:none}footer{padding:10px 12px;gap:8px}.controls{gap:12px}input[type=range]{width:100px}.keys{font-size:9px}#help{display:none}}
@media(max-width:600px){.brand{max-width:145px}.stat em{display:none}.gauge b{font-size:15px}.gauge svg{width:65px}.stats{gap:8px}.stat strong{font-size:17px}.stat small{font-size:8px}.keys{display:none}.controls{width:100%;justify-content:space-between}h1{font-size:12px}#mode{left:12px;top:9px;font-size:9px}}
</style>

function basePoint(){
const c=Math.cos(state.pitch),s=Math.sin(state.pitch);
return {x:537+c*state.rail+s*34,y:state.y+s*state.rail-c*34};
}
function computeGeometry(){
let p=basePoint(),cx=0,cy=0;
state.poses=[];
for(let i=0;i<4;i++){
 state.poses.push({x:p.x,y:p.y,a:state.q[i]});
 const dx=Math.sin(state.q[i])*lengths[i],dy=-Math.cos(state.q[i])*lengths[i];
 cx+=(p.x+dx*fractions[i])*masses[i];cy+=(p.y+dy*fractions[i])*masses[i];
 p={x:p.x+dx,y:p.y+dy};
}
state.com={x:cx/totalMass,y:cy/totalMass};
const b=state.poses[0];
state.angle=Math.atan2(state.com.x-b.x,b.y-state.com.y)*DEG;
}

/* 四节绝对角多刚体系统。
   每节的质心位置由前面所有关节累积确定。
   M = Σ m JᵀJ；离心项、支点加速度、重力以及关节反作用共同求解。
   关节弹性只约束相邻层，不向世界竖直方向施加自动扶正力。 */
function solveDynamics(dt){
const q=state.q,w=state.qd;
const M=Array.from({length:4},()=>Array(4).fill(0));
const F=Array(4).fill(0);
const g=147*Number(gravity.value)/100;
for(let body=0;body<4;body++){
 const J=[],m=masses[body];
 let bx=0,by=0;
 for(let j=0;j<=body;j++){
  const l=lengths[j]*(j===body?fractions[body]:1);
  J[j]={x:l*Math.cos(q[j]),y:l*Math.sin(q[j])};
  bx-=l*Math.sin(q[j])*w[j]*w[j];
  by+=l*Math.cos(q[j])*w[j]*w[j];
 }
 for(let j=0;j<=body;j++){
  F[j]+=m*(J[j].y*g-J[j].x*(state.baseA.x+bx)-J[j].y*(state.baseA.y+by));
  for(let k=0;k<=body;k++) M[j][k]+=m*(J[j].x*J[k].x+J[j].y*J[k].y);
 }
 M[body][body]+=m*lengths[body]*lengths[body]*.065;
}
for(let i=1;i<4;i++){
 const torque=-30000*(q[i]-q[i-1])-6000*(w[i]-w[i-1]);
 F[i]+=torque;F[i-1]-=torque;
}
const wind=state.wind;
for(let i=0;i<4;i++){
 F[i]+=wind*(450+150*i)-w[i]*700;
}
const phase=state.screwPhase;
const contact=Math.max(0,Math.sin(Math.PI*clamp((phase-.15)/.65,0,1)));
const vibration=(state.rage?7800:950)*Math.sin(state.t*(state.rage?74:36))*contact;
F[2]+=vibration;F[1]-=vibration*.7;F[3]-=vibration*.3;
for(let i=0;i<4;i++) M[i].push(F[i]);
for(let col=0;col<4;col++){
 let pivot=col;
 for(let row=col+1;row<4;row++) if(Math.abs(M[row][col])>Math.abs(M[pivot][col])) pivot=row;
 [M[col],M[pivot]]=[M[pivot],M[col]];
 const divisor=M[col][col];
 for(let k=col;k<5;k++) M[col][k]/=divisor;
 for(let row=0;row<4;row++){
  if(row===col)continue;
  const f=M[row][col];
  for(let k=col;k<5;k++) M[row][k]-=f*M[col][k];
 }
}
for(let i=0;i<4;i++){
 w[i]+=M[i][4]*dt;
 q[i]+=w[i]*dt;
}
}

function worldPoint(layer,x,y){
const p=state.poses[layer],c=Math.cos(p.a),s=Math.sin(p.a);
return {x:p.x+x*c-y*s,y:p.y+x*s+y*c};
}
function makeSparks(x,y,color,count=8){
for(let i=0;i<count;i++){
 const a=Math.random()*TAU,v=25+Math.random()*120;
 const node=el("path",{d:"M0 0L-4 0",stroke:color,"stroke-width":1.5,"stroke-linecap":"round"},$("particles"));
 sparks.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-25,life:.25+Math.random()*.35,max:.6,node});
}
}
function floatText(x,y,str,color){
const node=el("text",{x:0,y:0,fill:color,"font-size":13,"font-weight":700,"text-anchor":"middle"},$("floaters"));
node.textContent=str;texts.push({x,y,life:1.25,node});
}
function finishWork(kind,multiplier){
const chip=kind==="chip",base=chip?4:1,points=base*multiplier;
state.score+=points;
if(chip)state.chips++;else state.screws++;
const p=worldPoint(chip?3:2,chip?53:41,chip?-29:-44);
makeSparks(p.x,p.y,chip?"#8ffff0":"#ffd281",chip?13:9);
floatText(p.x+15,p.y-14,`${chip?"芯片":"产能"}+${points}`,chip?"#a6fff0":"#ffe3a1");
}
function work(dt){
const rage=state.rage,rate=rage?2:1;
state.screwMultiplier=Math.min(state.screwMultiplier,rage?3:1);
state.chipMultiplier=Math.min(state.chipMultiplier,rage?3:1);
state.screwPhase+=dt*.9*rate;
state.chipPhase+=dt*.55*rate;
if(state.screwPhase>=1){
 state.screwPhase-=1;finishWork("screw",state.screwMultiplier);
 state.screwMultiplier=rage?3:1;
 state.qd[2]+=(rage?.009:.0018);state.qd[1]-=(rage?.004:.0008);
}
if(state.chipPhase>=1){
 state.chipPhase-=1;finishWork("chip",state.chipMultiplier);
 state.chipMultiplier=rage?3:1;
}
}

function spawnCloud(){
const y=390+Math.random()*335;
const node=el("g",{},$("obstacles"));
node.innerHTML=`
<path d="M-67 27Q-95 1-68-24Q-59-40-34-33Q-36-69-5-70Q27-74 38-45Q69-52 77-26Q101-12 87 17Q75 45 40 36Q9 57-22 40Q-51 48-67 27Z" fill="url(#storm)" stroke="#8b9bad" stroke-opacity=".42" stroke-width="1.5"/>
<path d="M-64-21Q-47-31-35-24M-17-59Q9-68 26-48M48-36Q70-32 72-16" fill="none" stroke="#c3c8c5" opacity=".18" stroke-width="3"/>
<path class="lightning" d="M4-24L-13 6H7L-8 42L28-4H9L23-24Z" fill="#d4deff" filter="url(#glow)"/>
<text x="0" y="70" text-anchor="middle" fill="#d8dcf1" font-size="10" letter-spacing="3">雷暴禁区</text>`;
clouds.push({x:1570,y,r:68,speed:140+Math.random()*30,node});
}
function collision(c){
const co=Math.cos(state.pitch),si=Math.sin(state.pitch);
const dx=c.x-537,dy=c.y-state.y;
const x=dx*co+dy*si,y=-dx*si+dy*co;
const circles=[[-175,10,28],[-100,12,36],[-25,12,38],[55,10,40],[130,13,35],[195,17,25],[-96,56,24],[72,-43,34]];
return circles.some(([px,py,r])=>(x-px)**2+(y-py)**2<(r+c.r*.78)**2);
}

function updateEffects(dt){
for(let i=sparks.length-1;i>=0;i--){
 const p=sparks[i];p.life-=dt;
 if(p.life<=0){p.node.remove();sparks.splice(i,1);continue;}
 p.vy+=130*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
 transform(p.node,p.x,p.y,Math.atan2(p.vy,p.vx)*DEG);
 p.node.setAttribute("opacity",Math.min(1,p.life*3));
}
for(let i=texts.length-1;i>=0;i--){
 const p=texts[i];p.life-=dt;
 if(p.life<=0){p.node.remove();texts.splice(i,1);continue;}
 p.y-=27*dt;p.x+=8*dt;
 transform(p.node,p.x,p.y);p.node.setAttribute("opacity",Math.min(1,p.life*2));
}
for(let i=fragments.length-1;i>=0;i--){
 const p=fragments[i];p.vy+=245*Number(gravity.value)/100*dt;
 p.x+=p.vx*dt;p.y+=p.vy*dt;p.a+=p.spin*dt;
 p.node.setAttribute("transform",`translate(${p.x} ${p.y}) rotate(${p.a}) matrix(${p.m.a} ${p.m.b} ${p.m.c} ${p.m.d} 0 0) translate(${-p.cx} ${-p.cy})`);
 if(p.y>1400){p.node.remove();fragments.splice(i,1);}
}
}

function tick(dt){
state.t+=dt;
updateEffects(dt);
if(state.dead){
 state.deathT+=dt;
 if(state.deathT>.9)$("overlay").classList.add("visible");
 return;
}
state.rage=keys.has("Space");
const horizontal=(keys.has("KeyD")||keys.has("ArrowRight")?1:0)-(keys.has("KeyA")||keys.has("ArrowLeft")?1:0);
const vertical=(keys.has("KeyS")||keys.has("ArrowDown")?1:0)-(keys.has("KeyW")||keys.has("ArrowUp")?1:0);
const strength=Number(turb.value)/100;
state.wind=strength*(Math.sin(state.t*.79)*1.6+Math.sin(state.t*2.13+.4)*.8+Math.sin(state.t*4.7)*.35);
const oldBase=basePoint();
const oldV={...state.baseV};
const previousRail=state.rail;
const railAcceleration=horizontal*195-state.railV*(horizontal?.65:1.8);
state.railV=clamp(state.railV+railAcceleration*dt,-98,98);
state.rail+=state.railV*dt;
if(state.rail<-118){state.rail=-118;if(state.railV<0)state.railV=0;}
if(state.rail>118){state.rail=118;if(state.railV>0)state.railV=0;}
state.crank+=(state.rail-previousRail)/22;
const targetV=vertical*108;
state.vy+=(targetV-state.vy)*2.5*dt;
state.y+=state.vy*dt;
if(state.y<470){state.y=470;state.vy=Math.max(0,state.vy);}
if(state.y>746){state.y=746;state.vy=Math.min(0,state.vy);}
const targetPitch=vertical*.105+state.wind*.008;
state.pitchV+=((targetPitch-state.pitch)*10-state.pitchV*5.4)*dt;
state.pitch+=state.pitchV*dt;
const newBase=basePoint();
state.baseV={x:(newBase.x-oldBase.x)/dt,y:(newBase.y-oldBase.y)/dt};
state.baseA={x:(state.baseV.x-oldV.x)/dt,y:(state.baseV.y-oldV.y)/dt};
solveDynamics(dt);
computeGeometry();
if(Math.abs(state.angle)>65){endGame("整体重心越过 65° 安全极限。");return;}
work(dt);
state.spawn-=dt;
if(state.spawn<=0){spawnCloud();state.spawn=5.8+Math.random()*2.7;}
for(let i=clouds.length-1;i>=0;i--){
 const c=clouds[i];c.x-=c.speed*dt;
 if(collision(c)){endGame("飞机撞入雷云，天工号失去升力。");return;}
 if(c.x<-160){c.node.remove();clouds.splice(i,1);}
}
}

/* 直接从现场 SVG 世界矩阵提取零件：位置、朝向和最近帧速度全部继承。 */
function endGame(reason){
if(state.dead)return;
drawActors();
const inv=svg.getScreenCTM().inverse();
document.querySelectorAll("[data-piece]").forEach((piece,index)=>{
 const matrix=inv.multiply(piece.getScreenCTM()),box=piece.getBBox();
 const cx=box.x+box.width/2,cy=box.y+box.height/2;
 const center=new DOMPoint(cx,cy).matrixTransform(matrix);
 const previous=pieceHistory.get(piece);
 let vx=state.baseV.x,vy=state.baseV.y,spin=state.pitchV*DEG;
 if(previous){
  const delta=Math.max(.008,(performance.now()-previous.time)/1000);
  vx=clamp((center.x-previous.x)/delta,-600,600);
  vy=clamp((center.y-previous.y)/delta,-600,600);
  let da=Math.atan2(matrix.b,matrix.a)-previous.a;
  da=Math.atan2(Math.sin(da),Math.cos(da));
  spin=clamp(da/delta*DEG,-240,240);
 }
 const wrapper=el("g",{},$("debris"));
 const clone=piece.cloneNode(true);
 clone.removeAttribute("transform");clone.removeAttribute("data-piece");
 clone.querySelectorAll("[id]").forEach(n=>n.removeAttribute("id"));
 wrapper.appendChild(clone);
 const item={node:wrapper,x:center.x,y:center.y,cx,cy,m:matrix,a:0,
 vx:vx+(index%5-2)*9,vy:vy-15-(index%3)*8,spin:spin+(index%2?1:-1)*(18+index%7*8)};
 fragments.push(item);
 wrapper.setAttribute("transform",`translate(${item.x} ${item.y}) matrix(${matrix.a} ${matrix.b} ${matrix.c} ${matrix.d} 0 0) translate(${-cx} ${-cy})`);
});
state.dead=true;state.deathT=0;
$("vehicle").style.display="none";tierNodes.forEach(n=>n.style.display="none");
$("balanceGuide").style.display="none";$("tierLabels").style.display="none";
$("reason").textContent=reason;
$("finalScore").textContent=state.score;
$("finalDetail").textContent=`完成 ${state.screws} 颗螺丝 · ${state.chips} 枚芯片 · 坚持 ${state.t.toFixed(1)} 秒`;
$("mode").textContent="承重链断裂 · 本局生产已停止";
}

function leg(phase,front){
const hip={x:-8,y:-80};
const foot={x:Math.cos(phase)*12,y:-24+Math.sin(phase)*12};
const dx=foot.x-hip.x,dy=foot.y-hip.y,d=Math.hypot(dx,dy);
const a=36,b=36;
const along=(a*a-b*b+d*d)/(2*d);
const high=Math.sqrt(Math.max(0,a*a-along*along));
const knee={x:hip.x+dx/d*along+dy/d*high,y:hip.y+dy/d*along-dx/d*high};
const suffix=front?"Front":"Back";
$("leg"+suffix).setAttribute("d",`M${hip.x} ${hip.y}L${knee.x} ${knee.y}L${foot.x} ${foot.y}`);
$("knee"+suffix).setAttribute("cx",knee.x);$("knee"+suffix).setAttribute("cy",knee.y);
$("pedal"+suffix).setAttribute("d",`M${foot.x-6} ${foot.y+2}H${foot.x+6}`);
$("foot"+suffix).setAttribute("d",`M${foot.x-4} ${foot.y}L${foot.x+7} ${foot.y}`);
return foot;
}

function drawActors(){
transform($("vehicle"),537,state.y,state.pitch*DEG);
for(let i=0;i<4;i++){
 const p=state.poses[i];transform(tierNodes[i],p.x,p.y,p.a*DEG);
 const top=worldPoint(i,0,-lengths[i]*.64);
 transform($("tierLabels").children[i],top.x+111,top.y);
}
const t=state.t;
$("fan1").setAttribute("transform",`rotate(${t*1800})`);
$("fan2").setAttribute("transform",`rotate(${t*1900})`);
const flameScale=.92+Math.sin(t*47)*.075;
$("flame1").setAttribute("transform",`translate(-138 60) scale(${flameScale} ${1+.08*Math.sin(t*31)}) translate(138 -60)`);
$("flame2").setAttribute("transform",`translate(-160 22) scale(${1+.1*Math.sin(t*41)} 1) translate(160 -22)`);
$("featherA").setAttribute("d",`M48-79Q-1 ${-148+Math.sin(t*5)*10} -64 ${-108+Math.sin(t*5-1)*13}Q-78-94-100 ${-112+Math.sin(t*5-2)*9}`);
$("featherB").setAttribute("d",`M62-79Q33 ${-153+Math.sin(t*5+.5)*11} -31 ${-137+Math.sin(t*5-.5)*14}Q-69-123-82 ${-139+Math.sin(t*5-1.5)*11}`);
const cycle=state.crank;
$("wheelL").setAttribute("transform",`rotate(${cycle*DEG})`);
$("wheelR").setAttribute("transform",`rotate(${cycle*DEG})`);
const front=leg(cycle,true),back=leg(cycle+Math.PI,false);
$("crank").setAttribute("d",`M${front.x} ${front.y}L${back.x} ${back.y}`);
const wobble=clamp(state.baseA.x*.012,-3,3)+Math.sin(t*9)*Math.min(2,Math.abs(state.railV)*.035);
$("pouch").setAttribute("d",`M30-105L74-108Q57 ${-77+wobble} 31-84Q24-93 30-105Z`);
const lean=clamp((state.q[1]-state.q[0])*70,-4,4);
$("bearFrontLegs").setAttribute("d",`M-37-42Q${-46+lean}-23-42-6M33-42Q${26+lean}-22 30-6`);
$("bearRearLegs").setAttribute("d",`M-47-48Q${-54-lean}-20-53-3M30-46Q${37-lean}-21 40-3`);
const p=state.screwPhase;
let lift;
if(p<.32)lift=11*(1-p/.32);
else if(p<.74)lift=0;
else lift=11*(p-.74)/.26;
$("driver").setAttribute("transform",`translate(0 ${-lift})`);
$("emperorArm").setAttribute("d",`M20-61Q29 ${-62-lift} 36 ${-66-lift}`);
const sway=clamp(state.qd[2]*-13-state.baseA.x*.015,-18,18)+Math.sin(t*5)*1.3;
Array.from($("beads").children).forEach((g,i)=>{
 const x=-32+i*6.3;
 g.setAttribute("transform",`rotate(${sway+Math.sin(t*7+i*.6)*1.2} ${x} -97)`);
});
$("gearA").setAttribute("transform",`rotate(${t*(state.rage?170:85)})`);
$("gearB").setAttribute("transform",`rotate(${-t*(state.rage?170:85)})`);
$("featherFan").setAttribute("transform",`rotate(${Math.sin(t*2.6)*10} -28 -36)`);
$("hologram").setAttribute("transform",`rotate(${t*27})`);
const scan=state.chipPhase;
const lx=34+38*scan,ly=-29+Math.sin(scan*TAU*4)*4;
$("laser").setAttribute("d",`M44-43L${lx} ${ly}`);
$("laser").setAttribute("opacity",.65+.35*Math.sin(t*61)**2);
$("laserSpot").setAttribute("cx",lx);$("laserSpot").setAttribute("cy",ly);
const b=state.poses[0],com=state.com;
$("comLine").setAttribute("d",`M${b.x} ${b.y}L${com.x} ${com.y}`);
$("verticalLine").setAttribute("d",`M${b.x} ${b.y}V${b.y-220}`);
$("comDot").setAttribute("cx",com.x);$("comDot").setAttribute("cy",com.y);
}

function drawBackground(){
const t=state.t;
Array.from($("streams").children).forEach((n,i)=>{
 const x=((i*193-t*(70+i%5*17))%1640+1640)%1640-100;
 const y=60+(i*137)%650;
 transform(n,x,y);
});
Array.from($("mountains").children).forEach((n,i)=>{
 const shift=(t*(8+i*7))%1440;
 n.setAttribute("transform",`translate(${-shift} ${-i*14})`);
});
Array.from($("cloudSea").children).forEach((n,i)=>{
 const x=((i*197-t*(20+i%3*15))%1840+1840)%1840-200;
 const y=702+(i*47)%140,s=.6+(i%4)*.34;
 n.setAttribute("transform",`translate(${x} ${y}) scale(${s} ${s*.5})`);
});
clouds.forEach(c=>{
 transform(c.node,c.x,c.y);
 c.node.querySelector(".lightning").setAttribute("opacity",.35+.65*Math.sin(t*9+c.y)**8);
});
}

function draw(){
drawBackground();
if(!state.dead){
 drawActors();
 const now=performance.now(),inv=svg.getScreenCTM().inverse();
 document.querySelectorAll("[data-piece]").forEach(piece=>{
  const m=inv.multiply(piece.getScreenCTM()),box=piece.getBBox();
  const center=new DOMPoint(box.x+box.width/2,box.y+box.height/2).matrixTransform(m);
  pieceHistory.set(piece,{x:center.x,y:center.y,a:Math.atan2(m.b,m.a),time:now});
 });
 $("mode").classList.toggle("rage",state.rage);
 $("mode").textContent=state.rage?"大秦狂暴加班 · 速率 ×2 / 单次得分 ×3":"正常生产 · 将支点移向倾倒方向";
}
$("altitude").textContent=Math.round(8600+(628-state.y)*10);
$("production").textContent=state.score;
$("counts").textContent=`${state.screws} / ${state.chips}`;
const a=state.angle;
$("angle").textContent=(a>=0?"+":"")+a.toFixed(1)+"°";
$("angle").style.color=Math.abs(a)>45?"#ff8978":Math.abs(a)>20?"#f1cd78":"#a2e3c8";
$("needle").setAttribute("transform",`rotate(${clamp(a,-90,90)})`);
$("wind").textContent=`风速 ${(Math.abs(state.wind)*13).toFixed(1)} m/s`;
const strength=Number(turb.value);
$("warning").textContent=strength===0?"无乱流 · 仍需主动平衡":strength<40?"轻度乱流":strength<70?"中度乱流 · 注意修正":"强乱流 · 高危飞行";
$("warning").style.color=strength>65?"#ff9b79":"#87d9c0";
}

function frame(now){
if(document.hidden){lastTime=now;requestAnimationFrame(frame);return;}
const elapsed=Math.min((now-lastTime)/1000,.1);lastTime=now;
accumulator+=elapsed;
let steps=0;
while(accumulator>=H&&steps<12){tick(H);accumulator-=H;steps++;}
draw();renderTime=now;
requestAnimationFrame(frame);
}
const gameKeys=new Set(["KeyW","KeyS","KeyA","KeyD","ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"]);
window.addEventListener("keydown",e=>{
 if(!gameKeys.has(e.code))return;
 const tag=document.activeElement?.tagName;
 if(tag==="INPUT")return;
 if(tag==="BUTTON"&&e.code==="Space")return;
 e.preventDefault();keys.add(e.code);
});
window.addEventListener("keyup",e=>{
 if(gameKeys.has(e.code)){keys.delete(e.code);if(document.activeElement?.tagName!=="INPUT")e.preventDefault();}
});
window.addEventListener("blur",()=>keys.clear());
document.addEventListener("visibilitychange",()=>{keys.clear();lastTime=performance.now();accumulator=0;});
document.querySelectorAll("[data-key]").forEach(button=>{
 const code=button.dataset.key;
 button.addEventListener("pointerdown",e=>{
  e.preventDefault();button.setPointerCapture(e.pointerId);keys.add(code);
 });
 ["pointerup","pointercancel","lostpointercapture"].forEach(name=>button.addEventListener(name,()=>keys.delete(code)));
});
turb.addEventListener("input",()=>{$("turbOut").textContent=turb.value+"%";});
gravity.addEventListener("input",()=>{$("gravOut").textContent=(Number(gravity.value)/100).toFixed(2)+"×";});
$("reset").addEventListener("click",()=>{reset();$("reset").blur();});
$("restart").addEventListener("click",()=>{reset();$("restart").blur();});
reset();
requestAnimationFrame(frame);
})();
</script>
