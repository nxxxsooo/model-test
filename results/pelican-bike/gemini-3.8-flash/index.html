<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鹈鹕骑自行车 · 2D SVG 动画</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      color: #f8fafc;
      padding: 16px;
    }

    .main-container {
      position: relative;
      width: 100%;
      max-width: 1120px;
      background: #1e293b;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
    }

    .header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 10;
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge {
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .title {
      font-size: 16px;
      font-weight: 600;
      color: #f1f5f9;
      letter-spacing: 0.3px;
    }

    .stats {
      font-size: 13px;
      color: #94a3b8;
      display: flex;
      gap: 16px;
    }

    .stat-item span {
      color: #38bdf8;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .stage-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 12 / 7;
      max-height: 640px;
      background: #70c5ff;
      overflow: hidden;
    }

    svg#canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: pointer;
    }

    /* Floating Bubble Speech */
    .speech-bubble {
      position: absolute;
      top: 14%;
      left: 64%;
      transform: translate(-50%, -50%) scale(0);
      background: white;
      color: #1e293b;
      font-size: 13px;
      font-weight: bold;
      padding: 7px 14px;
      border-radius: 18px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
      pointer-events: none;
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.25s;
      opacity: 0;
      z-index: 20;
    }

    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 20px;
      border-width: 6px 6px 0;
      border-style: solid;
      border-color: white transparent;
      display: block;
      width: 0;
    }

    .speech-bubble.active {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
    }

    /* Control Bar */
    .controls-panel {
      padding: 16px 24px;
      background: rgba(15, 23, 42, 0.9);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      z-index: 10;
    }

    .btn-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #334155;
      color: #f1f5f9;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 500;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      outline: none;
    }

    .btn:hover {
      background: #475569;
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn.primary {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      border-color: rgba(56, 189, 248, 0.3);
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
    }

    .btn.primary:hover {
      background: linear-gradient(135deg, #0369a1, #075985);
    }

    .btn.accent {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      border-color: rgba(245, 158, 11, 0.3);
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
    }

    .speed-slider-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(30, 41, 59, 0.8);
      padding: 6px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .speed-label {
      font-size: 12px;
      color: #94a3b8;
      font-weight: 500;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 120px;
      height: 6px;
      background: #475569;
      border-radius: 4px;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #38bdf8;
      border: 2px solid #ffffff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      cursor: pointer;
      transition: transform 0.1s;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    .theme-selector {
      display: flex;
      gap: 4px;
      background: rgba(30, 41, 59, 0.8);
      padding: 4px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .theme-btn {
      background: transparent;
      border: none;
      padding: 5px 10px;
      border-radius: 7px;
      font-size: 12px;
      color: #94a3b8;
      cursor: pointer;
      transition: all 0.2s;
    }

    .theme-btn.active {
      background: #38bdf8;
      color: #0f172a;
      font-weight: 600;
    }

    .hints {
      font-size: 11px;
      color: #64748b;
      margin-top: 10px;
      text-align: center;
    }

    .hints kbd {
      background: #334155;
      color: #cbd5e1;
      padding: 2px 5px;
      border-radius: 4px;
      font-family: inherit;
    }
  </style>
</head>
<body>

  <div class="main-container">
    <!-- Top Bar -->
    <div class="header-bar">
      <div class="title-group">
        <span class="badge">SVG 2D Animation</span>
        <h1 class="title">鹈鹕巡游记 · Pelican on Bicycle</h1>
      </div>
      <div class="stats">
        <div class="stat-item">骑行速度: <span id="speedVal">24</span> km/h</div>
        <div class="stat-item">踩踏频次: <span id="cadenceVal">75</span> rpm</div>
        <div class="stat-item">累计里程: <span id="distVal">0.0</span> km</div>
      </div>
    </div>

    <!-- Animation Stage -->
    <div class="stage-wrapper" id="stage">
      <div class="speech-bubble" id="speechBubble">嘎！(HONK!) 🚴💨</div>

      <svg id="canvas" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Sky Gradients -->
          <linearGradient id="skyGradDay" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#4ea8de"/>
            <stop offset="50%" stop-color="#90e0ef"/>
            <stop offset="85%" stop-color="#caf0f8"/>
            <stop offset="100%" stop-color="#fef08a"/>
          </linearGradient>

          <linearGradient id="skyGradSunset" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#311432"/>
            <stop offset="35%" stop-color="#702652"/>
            <stop offset="65%" stop-color="#c14652"/>
            <stop offset="85%" stop-color="#f38448"/>
            <stop offset="100%" stop-color="#ffd166"/>
          </linearGradient>

          <linearGradient id="skyGradNight" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#050814"/>
            <stop offset="60%" stop-color="#0d1b2a"/>
            <stop offset="100%" stop-color="#1b263b"/>
          </linearGradient>

          <!-- Sun Flare & Glow -->
          <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
            <stop offset="30%" stop-color="#fef08a" stop-opacity="0.8"/>
            <stop offset="70%" stop-color="#f59e0b" stop-opacity="0.25"/>
            <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
          </radialGradient>

          <!-- Moon Glow -->
          <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#f8fafc" stop-opacity="0.9"/>
            <stop offset="50%" stop-color="#cbd5e1" stop-opacity="0.3"/>
            <stop offset="100%" stop-color="#64748b" stop-opacity="0"/>
          </radialGradient>

          <!-- Mountain & Hills Gradients -->
          <linearGradient id="mountainGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#607d8b" stop-opacity="0.85"/>
            <stop offset="100%" stop-color="#b0bec5" stop-opacity="0.5"/>
          </linearGradient>

          <linearGradient id="hillGrad1" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#55a630"/>
            <stop offset="100%" stop-color="#2b9348"/>
          </linearGradient>

          <linearGradient id="hillGrad2" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#80b918"/>
            <stop offset="100%" stop-color="#386641"/>
          </linearGradient>

          <!-- Road & Asphalt Gradient -->
          <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#334155"/>
            <stop offset="30%" stop-color="#1e293b"/>
            <stop offset="100%" stop-color="#0f172a"/>
          </linearGradient>

          <!-- Bike Frame Metallic Gradient -->
          <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ef4444"/>
            <stop offset="45%" stop-color="#f87171"/>
            <stop offset="70%" stop-color="#dc2626"/>
            <stop offset="100%" stop-color="#991b1b"/>
          </linearGradient>

          <!-- Chrome & Metal Parts -->
          <linearGradient id="chromeGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#e2e8f0"/>
            <stop offset="50%" stop-color="#ffffff"/>
            <stop offset="75%" stop-color="#cbd5e1"/>
            <stop offset="100%" stop-color="#94a3b8"/>
          </linearGradient>

          <!-- Tire Gradient -->
          <radialGradient id="tireGrad" cx="50%" cy="50%" r="50%">
            <stop offset="70%" stop-color="#0f172a"/>
            <stop offset="88%" stop-color="#1e293b"/>
            <stop offset="100%" stop-color="#090d16"/>
          </radialGradient>

          <!-- Rim Gradient -->
          <radialGradient id="rimGrad" cx="50%" cy="50%" r="50%">
            <stop offset="85%" stop-color="#e2e8f0"/>
            <stop offset="93%" stop-color="#94a3b8"/>
            <stop offset="100%" stop-color="#cbd5e1"/>
          </radialGradient>

          <!-- Pelican Feather Gradient -->
          <linearGradient id="featherGrad" x1="0" y1="0" x2="0.3" y2="1">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="60%" stop-color="#f1f5f9"/>
            <stop offset="90%" stop-color="#e2e8f0"/>
            <stop offset="100%" stop-color="#cbd5e1"/>
          </linearGradient>

          <!-- Pelican Wing Dark Accent -->
          <linearGradient id="wingDarkGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#475569"/>
            <stop offset="60%" stop-color="#334155"/>
            <stop offset="100%" stop-color="#1e293b"/>
          </linearGradient>

          <!-- Pelican Beak Upper -->
          <linearGradient id="beakGrad" x1="0" y1="0" x2="1" y2="0.3">
            <stop offset="0%" stop-color="#f59e0b"/>
            <stop offset="40%" stop-color="#fbbf24"/>
            <stop offset="85%" stop-color="#ea580c"/>
            <stop offset="100%" stop-color="#c2410c"/>
          </linearGradient>

          <!-- Pelican Throat Pouch (Gular Sac) -->
          <linearGradient id="pouchGrad" x1="0" y1="0" x2="0.8" y2="1">
            <stop offset="0%" stop-color="#fed7aa" stop-opacity="0.95"/>
            <stop offset="40%" stop-color="#fdba74" stop-opacity="0.9"/>
            <stop offset="80%" stop-color="#f472b6" stop-opacity="0.8"/>
            <stop offset="100%" stop-color="#fb7185" stop-opacity="0.95"/>
          </linearGradient>

          <!-- Pelican Webbed Feet -->
          <linearGradient id="feetGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#fb923c"/>
            <stop offset="60%" stop-color="#ea580c"/>
            <stop offset="100%" stop-color="#c2410c"/>
          </linearGradient>

          <!-- Fish inside Pouch -->
          <linearGradient id="fishGrad" x1="0" y1="0" x2="1" y2="0.5">
            <stop offset="0%" stop-color="#38bdf8"/>
            <stop offset="50%" stop-color="#0284c7"/>
            <stop offset="100%" stop-color="#f43f5e"/>
          </linearGradient>

          <!-- Bicycle Headlight Beam -->
          <linearGradient id="headlightBeam" x1="0" y1="0" x2="1" y2="0.5">
            <stop offset="0%" stop-color="#fef08a" stop-opacity="0.75"/>
            <stop offset="40%" stop-color="#fde047" stop-opacity="0.35"/>
            <stop offset="100%" stop-color="#fef08a" stop-opacity="0"/>
          </linearGradient>

          <!-- Scarf Flow -->
          <linearGradient id="scarfGrad" x1="0" y1="0" x2="1" y2="0.8">
            <stop offset="0%" stop-color="#06b6d4"/>
            <stop offset="50%" stop-color="#0891b2"/>
            <stop offset="100%" stop-color="#0e7490"/>
          </linearGradient>

          <!-- Drop Shadow Filters -->
          <filter id="shadowFilter" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.3"/>
          </filter>

          <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
          </filter>
        </defs>

        <!-- ================= SKY BACKGROUND LAYER ================= -->
        <rect id="skyRect" x="0" y="0" width="1200" height="530" fill="url(#skyGradDay)"/>

        <!-- Celestial Body (Sun / Moon) -->
        <g id="celestialGroup">
          <circle id="sunAura" cx="1020" cy="110" r="100" fill="url(#sunGlow)"/>
          <circle id="sunDisk" cx="1020" cy="110" r="42" fill="#fffbeb"/>
          <!-- Moon Elements (hidden in day) -->
          <circle id="moonDisk" cx="1020" cy="110" r="38" fill="#f8fafc" style="display: none;"/>
          <circle id="moonCrater1" cx="1010" cy="100" r="7" fill="#e2e8f0" style="display: none;"/>
          <circle id="moonCrater2" cx="1030" cy="120" r="5" fill="#e2e8f0" style="display: none;"/>
        </g>

        <!-- Night Stars Layer (hidden in day) -->
        <g id="starsLayer" style="display: none; opacity: 0.85;">
          <!-- Procedurally populated or preset stars -->
          <circle cx="80" cy="60" r="1.5" fill="#fff"/>
          <circle cx="160" cy="120" r="1" fill="#fff"/>
          <circle cx="280" cy="40" r="2" fill="#fff"/>
          <circle cx="390" cy="90" r="1.5" fill="#fff"/>
          <circle cx="520" cy="50" r="1" fill="#fff"/>
          <circle cx="680" cy="80" r="2" fill="#fff"/>
          <circle cx="810" cy="45" r="1.5" fill="#fff"/>
          <circle cx="940" cy="70" r="1.2" fill="#fff"/>
          <circle cx="1120" cy="40" r="1.8" fill="#fff"/>
          <circle cx="200" cy="180" r="1" fill="#fff"/>
          <circle cx="450" cy="150" r="1.5" fill="#fff"/>
          <circle cx="730" cy="140" r="1" fill="#fff"/>
        </g>

        <!-- Clouds Layer (Slow Parallax) -->
        <g id="cloudsLayer">
          <!-- Cloud 1 -->
          <g class="cloud" id="cloud1" transform="translate(100, 70)">
            <path d="M 0,20 Q 15,0 40,10 Q 60,-15 90,5 Q 125,-5 140,20 Q 160,25 150,45 Q 130,55 0,50 Z" fill="#ffffff" fill-opacity="0.85"/>
          </g>
          <!-- Cloud 2 -->
          <g class="cloud" id="cloud2" transform="translate(580, 110)">
            <path d="M 0,18 Q 20,-8 50,5 Q 80,-18 115,0 Q 145,-10 160,18 Q 180,25 170,40 Q 140,50 0,45 Z" fill="#ffffff" fill-opacity="0.75"/>
          </g>
          <!-- Cloud 3 -->
          <g class="cloud" id="cloud3" transform="translate(950, 60)">
            <path d="M 0,15 Q 18,-5 40,8 Q 65,-12 95,5 Q 120,-8 135,15 Q 150,22 140,38 Q 120,48 0,42 Z" fill="#ffffff" fill-opacity="0.8"/>
          </g>
        </g>

        <!-- Distant Mountains Layer (Very Slow Parallax) -->
        <g id="mountainsLayer">
          <!-- Continuous rolling mountain silhouettes -->
          <path id="mountainPath" d="M -100,530 L -100,280 L 80,180 L 220,310 L 390,160 L 530,290 L 710,140 L 880,300 L 1050,170 L 1220,290 L 1350,190 L 1500,530 Z" fill="url(#mountainGrad)"/>
          <!-- Snow caps on mountain peaks -->
          <polygon points="80,180 40,215 70,220 85,210 100,225 125,215" fill="#f8fafc" opacity="0.9"/>
          <polygon points="390,160 350,195 380,200 395,190 410,205 435,195" fill="#f8fafc" opacity="0.9"/>
          <polygon points="710,140 670,175 700,180 715,170 730,185 755,175" fill="#f8fafc" opacity="0.9"/>
          <polygon points="1050,170 1010,205 1040,210 1055,200 1070,215 1095,205" fill="#f8fafc" opacity="0.9"/>
        </g>

        <!-- Midground Rolling Hills & Windmills (Medium Parallax) -->
        <g id="hillsLayer">
          <!-- Back Hills -->
          <path id="backHillPath" d="M -200,530 C 50,420 200,430 400,480 C 600,520 780,410 1050,450 C 1250,480 1400,430 1600,530 Z" fill="url(#hillGrad1)" opacity="0.85"/>
          
          <!-- Windmill in distance -->
          <g id="windmillGroup" transform="translate(850, 370)">
            <polygon points="-8,70 8,70 5,0 -5,0" fill="#e2e8f0"/>
            <polygon points="-6,0 6,0 0,-10" fill="#991b1b"/>
            <circle cx="0" cy="0" r="3" fill="#334155"/>
            <!-- Rotating blades -->
            <g id="windmillBlades">
              <line x1="0" y1="0" x2="0" y2="-45" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round"/>
              <polygon points="0,-15 7,-30 0,-45" fill="#cbd5e1" opacity="0.9"/>
              <line x1="0" y1="0" x2="45" y2="0" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round"/>
              <polygon points="15,0 30,7 45,0" fill="#cbd5e1" opacity="0.9"/>
              <line x1="0" y1="0" x2="0" y2="45" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round"/>
              <polygon points="0,15 -7,30 0,45" fill="#cbd5e1" opacity="0.9"/>
              <line x1="0" y1="0" x2="-45" y2="0" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round"/>
              <polygon points="-15,0 -30,-7 -45,0" fill="#cbd5e1" opacity="0.9"/>
            </g>
          </g>

          <!-- Front Hills -->
          <path id="frontHillPath" d="M -150,530 C 120,440 320,490 550,470 C 800,450 950,510 1200,460 C 1350,440 1500,510 1600,530 Z" fill="url(#hillGrad2)"/>
        </g>

        <!-- Roadside Trees & Bushes (Fast Parallax) -->
        <g id="roadsideFoliageLayer">
          <!-- Trees will be smoothly moved via JS -->
        </g>

        <!-- ================= ROAD & GROUND LAYER ================= -->
        <!-- Verge / Grass Strip -->
        <rect x="0" y="515" width="1200" height="15" fill="#4d7c0f"/>
        <line x1="0" y1="515" x2="1200" y2="515" stroke="#a3e635" stroke-width="3"/>

        <!-- Road Surface -->
        <rect x="0" y="530" width="1200" height="170" fill="url(#roadGrad)"/>
        <!-- Curb Line -->
        <line x1="0" y1="531" x2="1200" y2="531" stroke="#cbd5e1" stroke-width="2" opacity="0.4"/>

        <!-- Animated Dashed Lane Centerline -->
        <g id="roadDashGroup">
          <!-- Dashes generated and animated via code for infinite seamless motion -->
        </g>

        <!-- Roadside Milestone / Guard Posts -->
        <g id="roadPostsLayer"></g>

        <!-- Ground Shadow Under Pelican & Bicycle -->
        <ellipse id="bikeShadow" cx="570" cy="535" rx="220" ry="14" fill="#000000" opacity="0.45" filter="url(#shadowFilter)"/>

        <!-- Headlight Beam (Night Mode) -->
        <polygon id="headlightCone" points="750,335 1200,410 1200,545 745,355" fill="url(#headlightBeam)" style="display: none;"/>

        <!-- ================= BICYCLE & PELICAN GROUP ================= -->
        <g id="cyclistContainer">
          
          <!-- 1. LEFT PEDAL & CRANK (Behind the frame) -->
          <g id="leftDrivetrain">
            <line id="leftCrank" x1="560" y1="460" x2="535" y2="440" stroke="#94a3b8" stroke-width="7" stroke-linecap="round"/>
            <circle id="leftPedalAxle" cx="535" cy="440" r="4" fill="#334155"/>
            <!-- Left Pedal Body -->
            <rect id="leftPedal" x="522" y="437" width="26" height="7" rx="3" fill="#1e293b"/>
          </g>

          <!-- 2. LEFT LEG (Background leg, darker shading for depth) -->
          <g id="leftLegGroup">
            <!-- Left Thigh -->
            <path id="leftThigh" d="M 515,335 L 565,395" stroke="#cbd5e1" stroke-width="26" stroke-linecap="round"/>
            <!-- Left Shin -->
            <path id="leftShin" d="M 565,395 L 535,440" stroke="#f97316" stroke-width="14" stroke-linecap="round"/>
            <!-- Left Webbed Foot -->
            <g id="leftFoot" transform="translate(535, 440)">
              <path d="M -6,0 C 0,-6 18,-6 24,2 C 16,5 8,6 -6,4 Z" fill="#ea580c"/>
              <path d="M 24,2 C 26,0 28,3 24,6" stroke="#c2410c" stroke-width="2"/>
            </g>
          </g>

          <!-- 3. REAR WHEEL (Center at X:390, Y:465, Radius:65) -->
          <g id="rearWheelGroup" transform="translate(390, 465)">
            <!-- Outer Tire -->
            <circle cx="0" cy="0" r="65" fill="none" stroke="url(#tireGrad)" stroke-width="16"/>
            <!-- Rim -->

  <script>
    (function() {
      // ================= AUDIO SYNTHESIZER (Web Audio API) =================
      let audioCtx = null;

      function initAudio() {
        if (!audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            audioCtx = new AudioContext();
          }
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      }

      // Realistic 2-Tone Bicycle Bell (Ding... Ding!)
      function playBellSound() {
        initAudio();
        if (!audioCtx) return;
        const now = audioCtx.currentTime;

        const strike = (freq, time, decay, gainLevel) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, time);

          // Harmonic shimmer
          const oscHarmonic = audioCtx.createOscillator();
          oscHarmonic.type = 'triangle';
          oscHarmonic.frequency.setValueAtTime(freq * 2.02, time);

          gain.gain.setValueAtTime(0, time);
          gain.gain.linearRampToValueAtTime(gainLevel, time + 0.005);
          gain.gain.exponentialRampToValueAtTime(0.0001, time + decay);

          osc.connect(gain);
          oscHarmonic.connect(gain);
          gain.connect(audioCtx.destination);

          osc.start(time);
          oscHarmonic.start(time);
          osc.stop(time + decay);
          oscHarmonic.stop(time + decay);
        };

        // First Ding
        strike(2093, now, 0.65, 0.35); // C7
        strike(2637, now, 0.5, 0.25);  // E7
        // Second Ding
        strike(2093, now + 0.12, 0.9, 0.4);
        strike(3136, now + 0.12, 0.6, 0.25); // G7
      }

      // Comical Pelican Honk / Quack Sound
      function playHonkSound() {
        initAudio();
        if (!audioCtx) return;
        const now = audioCtx.currentTime;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const filter = audioCtx.createBiquadFilter();

        osc.type = 'sawtooth';
        // Pitch drop like a waterfowl honk
        osc.frequency.setValueAtTime(260, now);
        osc.frequency.exponentialRampToValueAtTime(140, now + 0.28);

        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(680, now);
        filter.Q.setValueAtTime(4.0, now);

        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.35, now + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now);
        osc.stop(now + 0.32);
      }

      // ================= STATE & KINEMATICS ENGINE =================
      let isPlaying = true;
      let speedFactor = 1.0;
      let targetSpeedFactor = 1.0;
      let pedalAngle = 0; // in radians
      let totalDistance = 0; // in meters
      let lastTime = performance.now();

      // Parallax offsets

      // ================= 2-BONE INVERSE KINEMATICS SOLVER =================
      // Analytical 2-joint IK solution for knees & elbows
      function solveIK(hx, hy, px, py, l1, l2, bendDirection = 1) {
        const dx = px - hx;
        const dy = py - hy;
        let d = Math.hypot(dx, dy);

        // Clamp distance to avoid triangle inequality breakdown
        d = Math.min(d, l1 + l2 - 0.5);
        d = Math.max(d, Math.abs(l1 - l2) + 0.5);

        const phi = Math.atan2(dy, dx);
        const cosA = (l1 * l1 + d * d - l2 * l2) / (2 * l1 * d);
        const clampedCosA = Math.max(-1, Math.min(1, cosA));
        const alpha = Math.acos(clampedCosA);

        const kneeAngle = phi + bendDirection * alpha;
        return {
          kx: hx + l1 * Math.cos(kneeAngle),
          ky: hy + l1 * Math.sin(kneeAngle)
        };
      }

      // ================= ANIMATION TICK =================
      function animate(time) {
        const dt = Math.min((time - lastTime) / 1000, 0.08); // cap delta time
        lastTime = time;

        if (isPlaying) {
          // Smooth speed transition
          speedFactor += (targetSpeedFactor - speedFactor) * 0.08;

          // Angular pedaling velocity (cadence in rad/s)
          // Normal cadence ~75 RPM -> 7.85 rad/s
          const cadence = 7.85 * speedFactor;
          pedalAngle = (pedalAngle + cadence * dt) % (Math.PI * 2);

          // Linear wheel forward movement: v = omega * r
          // Bicycle wheel radius ~65 SVG units
          const linearSpeed = cadence * 65; // units per second
          totalDistance += (linearSpeed * 0.00035 * speedFactor); // simulated km

          // Update Dashboard UI
          const currentSpeedKmH = Math.round(24 * speedFactor);
          const currentRpm = Math.round(75 * speedFactor);
          speedVal.textContent = currentSpeedKmH;
          cadenceVal.textContent = currentRpm;
          distVal.textContent = totalDistance.toFixed(2);

          // --- 1. Wheel Rotation ---
          const wheelDeg = (pedalAngle * 180 / Math.PI) % 360;
          rearSpokes.setAttribute('transform', `rotate(${wheelDeg})`);
          frontSpokes.setAttribute('transform', `rotate(${wheelDeg})`);

          // --- 2. Parallax Background Scrolling ---
          const pxSpeed = linearSpeed * dt;

          // Road Dashes
          roadOffset = (roadOffset + pxSpeed) % dashSpacing;
          roadDashes.forEach((item, idx) => {
            let xPos = (idx * dashSpacing - roadOffset + 1400) % (dashCount * dashSpacing) - 100;
            item.el.setAttribute('x', xPos);
          });

          // Roadside Posts
          postOffset = (postOffset + pxSpeed * 0.95) % postSpacing;
          roadPosts.forEach((item, idx) => {
            let xPos = (idx * postSpacing - postOffset + 1800) % (6 * postSpacing) - 100;
            item.el.setAttribute('transform', `translate(${xPos}, 0)`);
          });

          // Roadside Trees / Foliage
          foliageOffset = (foliageOffset + pxSpeed * 0.75) % treeSpacing;
          roadsideFoliage.forEach((item, idx) => {
            let xPos = (idx * treeSpacing - foliageOffset + 2000) % (8 * treeSpacing) - 120;
            item.el.setAttribute('transform', `translate(${xPos}, 0)`);
          });

          // Hills & Mountains
          hillNearOffset = (hillNearOffset + pxSpeed * 0.28) % 600;
          frontHillPath.setAttribute('transform', `translate(${-hillNearOffset}, 0)`);

          hillFarOffset = (hillFarOffset + pxSpeed * 0.14) % 600;
          backHillPath.setAttribute('transform', `translate(${-hillFarOffset}, 0)`);

          mountainOffset = (mountainOffset + pxSpeed * 0.04) % 600;
          mountainPath.setAttribute('transform', `translate(${-mountainOffset}, 0)`);

          // Windmill
          windmillAngle = (windmillAngle + 60 * dt * speedFactor) % 360;
          windmillBlades.setAttribute('transform', `rotate(${windmillAngle})`);

          // Clouds (Slow drifting)
          cloudOffset1 = (cloudOffset1 + (pxSpeed * 0.02 + 8 * dt)) % 1400;
          cloudOffset2 = (cloudOffset2 + (pxSpeed * 0.015 + 6 * dt)) % 1400;
          cloudOffset3 = (cloudOffset3 + (pxSpeed * 0.025 + 10 * dt)) % 1400;
          document.getElementById('cloud1').setAttribute('transform', `translate(${1200 - cloudOffset1}, 70)`);
          document.getElementById('cloud2').setAttribute('transform', `translate(${1200 - cloudOffset2}, 110)`);
          document.getElementById('cloud3').setAttribute('transform', `translate(${1200 - cloudOffset3}, 55)`);

          // --- 3. Drivetrain & Pedals Kinematics ---
          const bbX = 560;
          const bbY = 460;
          const crankR = 32;

          // Right Pedal (Foreground)
          const rightPx = bbX + crankR * Math.cos(pedalAngle);
          const rightPy = bbY + crankR * Math.sin(pedalAngle);
          rightCrank.setAttribute('x2', rightPx);
          rightCrank.setAttribute('y2', rightPy);
          rightPedalAxle.setAttribute('cx', rightPx);
          rightPedalAxle.setAttribute('cy', rightPy);
          rightPedal.setAttribute('x', rightPx - 14);
          rightPedal.setAttribute('y', rightPy - 4);
          pedalReflector.setAttribute('x', rightPx - 8);
          pedalReflector.setAttribute('y', rightPy - 1.5);

          // Left Pedal (Background, opposite phase + Math.PI)
          const leftPx = bbX + crankR * Math.cos(pedalAngle + Math.PI);
          const leftPy = bbY + crankR * Math.sin(pedalAngle + Math.PI);
          leftCrank.setAttribute('x2', leftPx);
          leftCrank.setAttribute('y2', leftPy);
          leftPedalAxle.setAttribute('cx', leftPx);
          leftPedalAxle.setAttribute('cy', leftPy);
          leftPedal.setAttribute('x', leftPx - 13);
          leftPedal.setAttribute('y', leftPy - 3.5);

          // --- 4. Pelican Rider Organic Bobbing & Leaning ---
          // Hip bobs up and down twice per pedal turn (natural cycling cadence)
          const bobPhase = pedalAngle * 2;
          const bobY = Math.sin(bobPhase) * 3.5;
          const bobX = Math.cos(bobPhase) * 1.5;

          // Pelvis/Hip Center
          const rightHipX = 525 + bobX;
          const rightHipY = 340 + bobY;
          const leftHipX = 520 + bobX;
          const leftHipY = 338 + bobY;

          // Torso bobbing translation
          pelicanBodyGroup.setAttribute('transform', `translate(${bobX}, ${bobY})`);
          bikeShadow.setAttribute('rx', 220 + bobY * 2);

          // --- 5. Inverse Kinematics for Legs ---
          const thighLen = 86;
          const shinLen = 84;

          // Solve Right Leg (Foreground) - Knee bends forward (bendDirection: -1 in screen coords)
          const rightIK = solveIK(rightHipX, rightHipY, rightPx, rightPy, thighLen, shinLen, -1);
          rightThigh.setAttribute('d', `M ${rightHipX},${rightHipY} L ${rightIK.kx},${rightIK.ky}`);
          rightShin.setAttribute('d', `M ${rightIK.kx},${rightIK.ky} L ${rightPx},${rightPy}`);
          rightKneeCap.setAttribute('cx', rightIK.kx);
          rightKneeCap.setAttribute('cy', rightIK.ky);
          rightFoot.setAttribute('transform', `translate(${rightPx}, ${rightPy})`);

          // Solve Left Leg (Background)
          const leftIK = solveIK(leftHipX, leftHipY, leftPx, leftPy, thighLen, shinLen, -1);
          leftThigh.setAttribute('d', `M ${leftHipX},${leftHipY} L ${leftIK.kx},${leftIK.ky}`);
          leftShin.setAttribute('d', `M ${leftIK.kx},${leftIK.ky} L ${leftPx},${leftPy}`);
          leftFoot.setAttribute('transform', `translate(${leftPx}, ${leftPy})`);

          // --- 6. Gular Pouch Elasticity & Wobble ---
          // The throat pouch lags slightly behind the bobbing motion for fluid elasticity
          const pouchBounce = Math.sin(bobPhase - 0.7) * 7 * Math.min(speedFactor, 1.8);
          const pouchBellyY = 245 + pouchBounce;
          const pouchMidY = 225 + pouchBounce * 0.8;

          pelicanPouch.setAttribute('d', `M 648,155 C 665,${pouchBellyY} 745,${pouchBellyY} 818,162 C 750,${pouchMidY} 680,${pouchMidY - 10} 648,155 Z`);
          pouchBack.setAttribute('d', `M 650,158 Q 720,${pouchBellyY + 5} 815,165 Q 730,${pouchBellyY + 20} 650,158 Z`);
          pouchRibs.setAttribute('d', `M 670,175 Q 700,${pouchBellyY - 20} 740,${pouchBellyY - 20} M 695,170 Q 730,${pouchBellyY - 25} 770,195 M 730,168 Q 765,190 795,175`);

          // Fish inside pouch wiggles and rotates with pouch bounce
          const fishWiggle = Math.sin(time * 0.012) * 6;
          const fishBobY = 195 + pouchBounce * 0.65;
          pouchFish.setAttribute('transform', `translate(${735 + fishWiggle * 0.5}, ${fishBobY}) rotate(${fishWiggle})`);
          fishTail.setAttribute('transform', `rotate(${Math.sin(time * 0.02) * 22})`);

          // --- 7. Flowing Scarf Wave Simulation ---
          const waveFreq = 0.015 * speedFactor;
          const waveAmp = 7 * speedFactor;
          const w1 = Math.sin(time * waveFreq) * waveAmp;
          const w2 = Math.cos(time * waveFreq * 1.3) * waveAmp;

          scarfTail1.setAttribute('d', `M 608,230 Q ${550 + w1},${215 + w2} ${500 + w2},${225 + w1} Q ${460 - w1},${235 + w2} ${415 + w2},${220 + w1}`);
          scarfTail2.setAttribute('d', `M 610,233 Q ${560 - w2},${230 + w1} ${515 + w1},${245 - w2} Q ${470 + w2},${255 + w1} ${430 - w1},${242 + w2}`);

          // --- 8. Blinking Eye Mechanism ---
          blinkTimer += dt;
          if (blinkTimer > 3.2 && !isBlinking) {
            isBlinking = true;
            eyelid.setAttribute('d', 'M -9,-2 Q 0,4 9,-2');
            eyelid.setAttribute('stroke-width', '4');
            setTimeout(() => {
              eyelid.setAttribute('d', 'M -9,-6 Q 0,-13 9,-6');
              eyelid.setAttribute('stroke-width', '2.5');
              isBlinking = false;
              blinkTimer = 0;
            }, 140);
          }

          // --- 9. Dynamic Tire Dust & Speed Streaks ---
          if (Math.random() < 0.3 * speedFactor) {
            createDustPuff();
          }
          updateDust(dt);
        }

        requestAnimationFrame(animate);
      }

      // ================= TIRE DUST PUFF PARTICLES =================
      function createDustPuff() {
        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        const r = 2.5 + Math.random() * 4;
        const startX = 390 - 45 - Math.random() * 10;
        const startY = 528 - Math.random() * 6;
        circle.setAttribute('cx', startX);
        circle.setAttribute('cy', startY);
        circle.setAttribute('r', r);
        circle.setAttribute('fill', '#e2e8f0');
        circle.setAttribute('opacity', 0.6);
        effectsGroup.appendChild(circle);

        dustParticles.push({
          el: circle,
          x: startX,
          y: startY,
          vx: -(120 + Math.random() * 80) * speedFactor,
          vy: -(15 + Math.random() * 25),
          r: r,
          life: 0.45
        });
      }

      function updateDust(dt) {
        for (let i = dustParticles.length - 1; i >= 0; i--) {
          const p = dustParticles[i];
          p.life -= dt;
          if (p.life <= 0) {
            p.el.remove();
            dustParticles.splice(i, 1);
            continue;
          }
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.r += 8 * dt;
          p.el.setAttribute('cx', p.x);
          p.el.setAttribute('cy', p.y);
          p.el.setAttribute('r', p.r);
          p.el.setAttribute('opacity', (p.life / 0.45) * 0.5);
        }
      }

        }
      });

      // ================= THEME SWITCHER (Day / Sunset / Night) =================
      themeBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          themeBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          const theme = btn.dataset.theme;

          if (theme === 'day') {
            skyRect.setAttribute('fill', 'url(#skyGradDay)');
            sunAura.style.display = 'block';
            sunDisk.style.display = 'block';
            moonDisk.style.display = 'none';
            moonCrater1.style.display = 'none';
            moonCrater2.style.display = 'none';
            starsLayer.style.display = 'none';
            headlightCone.style.display = 'none';
            stage.style.background = '#70c5ff';
          } else if (theme === 'sunset') {
            skyRect.setAttribute('fill', 'url(#skyGradSunset)');
            sunAura.style.display = 'block';
            sunDisk.style.display = 'block';
            moonDisk.style.display = 'none';
            moonCrater1.style.display = 'none';
            moonCrater2.style.display = 'none';
            starsLayer.style.display = 'none';
            headlightCone.style.display = 'none';
            stage.style.background = '#702652';
          } else if (theme === 'night') {
            skyRect.setAttribute('fill', 'url(#skyGradNight)');
            sunAura.style.display = 'none';
            sunDisk.style.display = 'none';
            moonDisk.style.display = 'block';
            moonCrater1.style.display = 'block';
            moonCrater2.style.display = 'block';
            starsLayer.style.display = 'block';
            headlightCone.style.display = 'block'; // Turn on bike headlight!
            stage.style.background = '#050814';
          }
        });
      });

      // Start loop
      requestAnimationFrame(animate);

    })();
  </script>
</body>
</html>
