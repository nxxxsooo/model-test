<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, #eaf4ff 0%, #f7fbff 100%);
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 20px;
  }
  .card {
    background: #fff;
    border-radius: 18px;
    padding: 22px 22px 14px;
    box-shadow: 0 14px 40px rgba(31, 84, 148, 0.16);
    max-width: 840px;
    width: 100%;
  }
  svg {
    display: block;
    width: 100%;

    line-height: 1.6;

  /* ---------- CSS 动画（位移/形变类；旋转类用 SMIL 保证跨浏览器稳定） ---------- */

  /* 鹈鹕身体随踩踏上下颠簸 */
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-7px); }
  }
  .bob { animation: bob 0.65s ease-in-out infinite; }

  /* 云朵 / 飞鸟向左漂移 */
  @keyframes drift {
    from { transform: translateX(920px); }
    to   { transform: translateX(-320px); }
  }
  .cloud { fill: #ffffff; animation: drift linear infinite; }
  .c1 { animation-duration: 42s; opacity: 0.92; }
  .c2 { animation-duration: 58s; animation-delay: -24s; opacity: 0.8; }
  .c3 { animation-duration: 32s; animation-delay: -12s; opacity: 0.7; }
  .bird { fill: none; stroke: #6a8fae; stroke-width: 2.5; stroke-linecap: round; animation: drift linear infinite; }
  .b1 { animation-duration: 18s; }
  .b2 { animation-duration: 26s; animation-delay: -9s; opacity: 0.8; }

  /* 道路虚线向前滚动 */
  @keyframes dashScroll { to { stroke-dashoffset: -48; } }
  .dash { animation: dashScroll 0.5s linear infinite; }

  /* 喉囊轻微晃荡（绕喉囊顶部缩放） */
  @keyframes pouchWiggle {
    0%, 100% { transform: scale(1, 1); }
    50%      { transform: scale(1.06, 0.92); }
  }
  .pouch {
    transform-box: fill-box;
    transform-origin: 55% 8%;
    animation: pouchWiggle 1.3s ease-in-out infinite;
  }

  /* 眨眼 */
  @keyframes blink {
    0%, 90%, 100% { transform: scaleY(1); }
    93%, 96%      { transform: scaleY(0.08); }
  }
  .eye {
    transform-box: fill-box;
    transform-origin: center;
    animation: blink 4.2s ease-in-out infinite;
  }
</style>
