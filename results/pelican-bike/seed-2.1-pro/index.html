<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 · SVG 动画</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23bfe3f2'/><ellipse cx='13' cy='18' rx='8' ry='6' fill='white'/><path d='M17 15h11l-4 5h-7z' fill='%23f29a2e'/></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: linear-gradient(160deg, #f7efe1 0%, #efe4d0 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px 16px;
    color: #3a4150;
  }
  .stage-card {
    width: 100%;
    max-width: 980px;
    background: #ffffff;
    border-radius: 22px;
    box-shadow: 0 18px 50px rgba(90, 74, 48, .14);
    padding: 22px 22px 18px;
  }
  .stage-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 14px;
    padding: 0 4px;
  }
  .stage-head h1 {
    font-size: 21px;
    font-weight: 700;
    letter-spacing: .5px;
  }
  .stage-head p {
    font-size: 12.5px;
    color: #8a93a2;
  }
  .svg-wrap {
    width: 100%;
    border-radius: 16px;
    overflow: hidden;
    line-height: 0;
    background: #bfe3f2;
  }
  svg { display: block; width: 100%; height: auto; }
  .stage-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 14px;
    padding: 0 4px;
  }
  .stage-foot span {
    font-size: 12px;
    color: #98a1af;
  }
  #toggleBtn {
    appearance: none;
    border: none;
    cursor: pointer;
    background: #cf5136;
    color: #fff;
    font-size: 13.5px;
    font-weight: 600;
    padding: 9px 22px;
    border-radius: 999px;
    transition: background .2s ease, transform .15s ease;
  }
  #toggleBtn:hover { background: #b8432c; }
  #toggleBtn:active { transform: scale(.96); }
  @media (max-width: 520px) {
    body { padding: 14px 10px; }
    .stage-card { padding: 14px 12px 12px; border-radius: 16px; }
    .stage-head h1 { font-size: 17px; }
  }
</style>
</head>
<body>
  <main class="stage-card">
    <header class="stage-head">
      <h1>鹈鹕骑行记</h1>
      <p>纯内联 SVG + SMIL 绘制，无任何外部素材</p>
    </header>

    <div class="svg-wrap">
      <svg id="scene" viewBox="0 0 960 540" role="img" aria-label="一只鹈鹕骑自行车的二维动画">
        <defs>
          <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#a9d8ef"/>
            <stop offset="60%" stop-color="#d7effa"/>
            <stop offset="100%" stop-color="#eef9fd"/>
          </linearGradient>
          <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#fff0b8"/>
            <stop offset="100%" stop-color="#ffc64a"/>
          </radialGradient>
          <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="100%" stop-color="#e2edf6"/>
          </linearGradient>
          <linearGradient id="pouchGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ffcf7d"/>
            <stop offset="100%" stop-color="#f19427"/>
          </linearGradient>
          <filter id="softBlur" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="7"/>
          </filter>
        </defs>

        <!-- ===== 天空 ===== -->
        <rect x="0" y="0" width="960" height="540" fill="url(#skyGrad)"/>

        <!-- ===== 太阳（光芒慢转） ===== -->
        <g transform="translate(828,92)">
          <circle r="72" fill="#ffe28a" opacity=".35"/>
          <g>
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="48s" repeatCount="indefinite"/>
            <g stroke="#ffd463" stroke-width="5" stroke-linecap="round">
              <line x1="0" y1="-54" x2="0" y2="-68"/>
              <line x1="0" y1="54"  x2="0" y2="68"/>
              <line x1="-54" y1="0" x2="-68" y2="0"/>
              <line x1="54" y1="0"  x2="68" y2="0"/>
              <line x1="38" y1="-38" x2="48" y2="-48"/>
              <line x1="-38" y1="38" x2="-48" y2="48"/>
              <line x1="38" y1="38" x2="48" y2="48"/>
              <line x1="-38" y1="-38" x2="-48" y2="-48"/>
            </g>
          </g>
          <circle r="40" fill="url(#sunGrad)"/>
        </g>

        <!-- ===== 漂移的云 ===== -->
        <g fill="#ffffff" opacity=".95">
          <animateTransform attributeName="transform" type="translate" from="-220 0" to="1180 0" dur="46s" repeatCount="indefinite"/>
          <ellipse cx="0" cy="86" rx="42" ry="25"/>
          <ellipse cx="38" cy="72" rx="34" ry="23"/>
          <ellipse cx="74" cy="86" rx="48" ry="25"/>
          <ellipse cx="36" cy="94" rx="42" ry="20"/>
        </g>
        <g fill="#ffffff" opacity=".8">
          <animateTransform attributeName="transform" type="translate" from="1180 0" to="-260 0" dur="64s" repeatCount="indefinite"/>
          <g transform="translate(0,156) scale(.68)">
            <ellipse cx="0" cy="0" rx="42" ry="25"/>
            <ellipse cx="38" cy="-14" rx="34" ry="23"/>
            <ellipse cx="74" cy="0" rx="48" ry="25"/>
          </g>
        </g>
        <g fill="#ffffff" opacity=".7">
          <animateTransform attributeName="transform" type="translate" from="-200 0" to="1180 0" dur="55s" begin="-30s" repeatCount="indefinite"/>
          <g transform="translate(0,52) scale(.55)">
            <ellipse cx="0" cy="0" rx="42" ry="25"/>
            <ellipse cx="38" cy="-14" rx="34" ry="23"/>
            <ellipse cx="74" cy="0" rx="48" ry="25"/>
          </g>
        </g>

        <!-- ===== 远山（静止） ===== -->
        <path d="M0 424 Q150 366 320 412 T640 406 T960 418 L960 464 L0 464 Z" fill="#a9d095"/>
        <path d="M0 442 Q200 402 400 440 T800 438 T960 444 L960 464 L0 464 Z" fill="#7fb46c"/>

        <!-- ===== 近景草丛（中速滚动） ===== -->
        <g stroke="#5c9747" stroke-width="2.6" stroke-linecap="round" fill="none" opacity=".9">
          <animateTransform attributeName="transform" type="translate" from="0 0" to="-120 0" dur="1.8s" repeatCount="indefinite"/>
          <!-- 每 120px 一丛，循环宽度 120 -->
          <g>
            <path d="M6 462 q4 -13 9 0 M15 462 q4 -15 9 0 M24 462 q4 -11 9 0"/>
            <path d="M126 462 q4 -13 9 0 M135 462 q4 -15 9 0 M144 462 q4 -11 9 0"/>
            <path d="M246 462 q4 -13 9 0 M255 462 q4 -15 9 0 M264 462 q4 -11 9 0"/>
            <path d="M366 462 q4 -13 9 0 M375 462 q4 -15 9 0 M384 462 q4 -11 9 0"/>
            <path d="M486 462 q4 -13 9 0 M495 462 q4 -15 9 0 M504 462 q4 -11 9 0"/>
            <path d="M606 462 q4 -13 9 0 M615 462 q4 -15 9 0 M624 462 q4 -11 9 0"/>
            <path d="M726 462 q4 -13 9 0 M735 462 q4 -15 9 0 M744 462 q4 -11 9 0"/>
            <path d="M846 462 q4 -13 9 0 M855 462 q4 -15 9 0 M864 462 q4 -11 9 0"/>
            <path d="M966 462 q4 -13 9 0 M975 462 q4 -15 9 0 M984 462 q4 -11 9 0"/>
          </g>
        </g>

        <!-- ===== 路面与车道线（快速滚动） ===== -->
        <rect x="0" y="462" width="960" height="78" fill="#596270"/>
        <line x1="0" y1="462" x2="960" y2="462" stroke="#464e5a" stroke-width="4"/>
        <g fill="#eef0f2" opacity=".92">
          <animateTransform attributeName="transform" type="translate" from="0 0" to="-130 0" dur=".55s" repeatCount="indefinite"/>
          <rect x="-60" y="506" width="64" height="9" rx="4.5"/>
          <rect x="70"  y="506" width="64" height="9" rx="4.5"/>
          <rect x="200" y="506" width="64" height="9" rx="4.5"/>
          <rect x="330" y="506" width="64" height="9" rx="4.5"/>
          <rect x="460" y="506" width="64" height="9" rx="4.5"/>
          <rect x="590" y="506" width="64" height="9" rx="4.5"/>
          <rect x="720" y="506" width="64" height="9" rx="4.5"/>
          <rect x="850" y="506" width="64" height="9" rx="4.5"/>
          <rect x="980" y="506" width="64" height="9" rx="4.5"/>
        </g>

        <!-- ===== 后轮扬尘 ===== -->
        <g fill="#cfc7ba">
          <circle cx="312" cy="470" r="5" opacity="0">
            <animate attributeName="cx" values="312;250" dur=".8s" begin="0s" repeatCount="indefinite"/>
            <animate attributeName="r" values="4;13" dur=".8s" begin="0s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values=".55;0" dur=".8s" begin="0s" repeatCount="indefinite"/>
          </circle>
          <circle cx="312" cy="470" r="5" opacity="0">
            <animate attributeName="cx" values="312;258" dur=".8s" begin=".27s" repeatCount="indefinite"/>
            <animate attributeName="r" values="4;11" dur=".8s" begin=".27s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values=".5;0" dur=".8s" begin=".27s" repeatCount="indefinite"/>
          </circle>
          <circle cx="312" cy="470" r="5" opacity="0">
            <animate attributeName="cx" values="312;264" dur=".8s" begin=".54s" repeatCount="indefinite"/>
            <animate attributeName="r" values="3;9" dur=".8s" begin=".54s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values=".45;0" dur=".8s" begin=".54s" repeatCount="indefinite"/>
          </circle>
        </g>

        <!-- ===== 整车投影 ===== -->
        <ellipse cx="486" cy="476" rx="252" ry="15" fill="#2b313b" opacity=".14" filter="url(#softBlur)"/>

        <!-- ===== 后轮（旋转） ===== -->
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0 330 400" to="360 330 400" dur="1.1s" repeatCount="indefinite"/>
          <circle cx="330" cy="400" r="70" fill="#303742"/>
          <circle cx="330" cy="400" r="57" fill="#f4f7fa"/>
          <g stroke="#b3bdca" stroke-width="2.2">
            <line x1="330" y1="400" x2="383" y2="400"/>
            <line x1="330" y1="400" x2="367.5" y2="437.5"/>
            <line x1="330" y1="400" x2="330" y2="453"/>
            <line x1="330" y1="400" x2="292.5" y2="437.5"/>
            <line x1="330" y1="400" x2="277" y2="400"/>
            <line x1="330" y1="400" x2="292.5" y2="362.5"/>
            <line x1="330" y1="400" x2="330" y2="347"/>
            <line x1="330" y1="400" x2="367.5" y2="362.5"/>
          </g>
          <circle cx="330" cy="400" r="57" fill="none" stroke="#aab5c2" stroke-width="4"/>
          <circle cx="330" cy="400" r="8" fill="#5d6877" stroke="#303742" stroke-width="2"/>
        </g>

        <!-- ===== 前轮（旋转） ===== -->
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0 640 400" to="360 640 400" dur="1.1s" repeatCount="indefinite"/>
          <circle cx="640" cy="400" r="70" fill="#303742"/>
          <circle cx="640" cy="400" r="57" fill="#f4f7fa"/>
          <g stroke="#b3bdca" stroke-width="2.2">
            <line x1="640" y1="400" x2="693" y2="400"/>
            <line x1="640" y1="400" x2="677.5" y2="437.5"/>
            <line x1="640" y1="400" x2="640" y2="453"/>
            <line x1="640" y1="400" x2="602.5" y2="437.5"/>
            <line x1="640" y1="400" x2="587" y2="400"/>
            <line x1="640" y1="400" x2="602.5" y2="362.5"/>
            <line x1="640" y1="400" x2="640" y2="347"/>
            <line x1="640" y1="400" x2="677.5" y2="362.5"/>
          </g>
          <circle cx="640" cy="400" r="57" fill="none" stroke="#aab5c2" stroke-width="4"/>
          <circle cx="640" cy="400" r="8" fill="#5d6877" stroke="#303742" stroke-width="2"/>
        </g>

        <!-- ===== 车架 ===== -->
        <g fill="none" stroke-linecap="round" stroke-linejoin="round">
          <!-- 深色描边打底，做出圆管质感 -->
          <g stroke="#a63a24" stroke-width="13">
            <path d="M330 400 L485 395"/>
            <path d="M330 400 L380 288"/>
            <path d="M380 288 L485 395"/>
            <path d="M485 395 L646 288"/>
            <path d="M380 288 L646 288"/>
            <path d="M646 288 L640 400"/>
          </g>
          <g stroke="#d9573a" stroke-width="9">
            <path d="M330 400 L485 395"/>
            <path d="M330 400 L380 288"/>
            <path d="M380 288 L485 395"/>
            <path d="M485 395 L646 288"/>
            <path d="M380 288 L646 288"/>
            <path d="M646 288 L640 400"/>
          </g>
          <!-- 车把 -->
          <path d="M646 288 L650 268 Q662 252 682 256" stroke="#3a4150" stroke-width="8"/>
          <!-- 链条 -->
          <path d="M341 393 L464 383" stroke="#8a94a3" stroke-width="3"/>
          <path d="M341 407 L464 407" stroke="#8a94a3" stroke-width="3"/>
        </g>
        <!-- 后飞轮 / 接缝点 / 车座 -->
        <circle cx="330" cy="400" r="11" fill="#e8edf2" stroke="#8a94a3" stroke-width="3"/>
        <circle cx="485" cy="395" r="5.5" fill="#d9573a"/>
        <circle cx="380" cy="288" r="5.5" fill="#d9573a"/>
        <circle cx="646" cy="288" r="5.5" fill="#d9573a"/>
        <path d="M346 286 Q378 269 412 283 L412 291 Q378 281 346 293 Z" fill="#40322b"/>

        <!-- ===== 鹈鹕远侧腿（暗） ===== -->
        <g transform="translate(372,296)">
          <g>
            <animateTransform attributeName="transform" type="rotate"
              values="49 33 36 48 49" keyTimes="0;.25;.5;.75;1" dur=".8s" repeatCount="indefinite"/>
            <line x1="0" y1="0" x2="52" y2="58" stroke="#c47317" stroke-width="15" stroke-linecap="round"/>
            <line x1="0" y1="0" x2="52" y2="58" stroke="#e88f24" stroke-width="10" stroke-linecap="round"/>
            <g transform="translate(52,58)">
              <g>
                <animateTransform attributeName="transform" type="rotate"
                  values="-6 8 6 -8 -6" keyTimes="0;.25;.5;.75;1" dur=".8s" repeatCount="indefinite"/>
                <line x1="0" y1="0" x2="61" y2="41" stroke="#c47317" stroke-width="13" stroke-linecap="round"/>
                <line x1="0" y1="0" x2="61" y2="41" stroke="#e88f24" stroke-width="8.5" stroke-linecap="round"/>
                <g transform="translate(61,41)">
                  <ellipse cx="8" cy="2" rx="14" ry="7" fill="#e88f24" transform="rotate(18)"/>
                </g>
              </g>
            </g>
          </g>
        </g>

        <!-- ===== 鹈鹕近侧腿（亮） ===== -->
        <g transform="translate(372,296)">
          <g>
            <animateTransform attributeName="transform" type="rotate"
              values="36 48 49 33 36" keyTimes="0;.25;.5;.75;1" dur=".8s" repeatCount="indefinite"/>
            <line x1="0" y1="0" x2="52" y2="58" stroke="#d9821c" stroke-width="16" stroke-linecap="round"/>
            <line x1="0" y1="0" x2="52" y2="58" stroke="#f6a53a" stroke-width="11" stroke-linecap="round"/>
            <g transform="translate(52,58)">
              <g>
                <animateTransform attributeName="transform" type="rotate"
                  values="6 -8 -6 8 6" keyTimes="0;.25;.5;.75;1" dur=".8s" repeatCount="indefinite"/>
                <line x1="0" y1="0" x2="61" y2="41" stroke="#d9821c" stroke-width="14" stroke-linecap="round"/>
                <line x1="0" y1="0" x2="61" y2="41" stroke="#f6a53a" stroke-width="9" stroke-linecap="round"/>
                <g transform="translate(61,41)">
                  <ellipse cx="8" cy="2" rx="15" ry="7.5" fill="#f6a53a" stroke="#d9821c" stroke-width="1.5" transform="rotate(18)"/>
                </g>
              </g>
            </g>
          </g>
        </g>

        <!-- ===== 曲柄牙盘（旋转，盖在脚掌上） ===== -->
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0 485 395" to="360 485 395" dur=".8s" repeatCount="indefinite"/>
          <circle cx="485" cy="395" r="21" fill="#eef2f6" stroke="#98a3b1" stroke-width="4"/>
          <circle cx="485" cy="395" r="4.5" fill="#5d6877"/>
          <line x1="485" y1="395" x2="461" y2="395" stroke="#78828f" stroke-width="5" stroke-linecap="round"/>
          <rect x="446" y="390" width="18" height="10" rx="3" fill="#5a6470"/>
          <line x1="485" y1="395" x2="509" y2="395" stroke="#4a525e" stroke-width="7" stroke-linecap="round"/>
          <rect x="506" y="390" width="18" height="10" rx="3" fill="#333a42"/>
        </g>

        <!-- ===== 鹈鹕身体（随蹬踏轻微起伏） ===== -->
        <g>
          <animateTransform attributeName="transform" type="translate"
            values="0 0;0 -2.6;0 0" keyTimes="0;.5;1" dur=".8s" repeatCount="indefinite"/>
          <!-- 尾羽 -->
          <path d="M332 252 Q296 240 282 254 Q308 264 332 264 Z" fill="#f2f7fb" stroke="#cdd9e4" stroke-width="2"/>
          <path d="M334 268 Q302 262 290 276 Q312 282 336 278 Z" fill="#e9f1f7" stroke="#cdd9e4" stroke-width="2"/>
          <!-- 躯干 -->
          <ellipse cx="372" cy="232" rx="58" ry="64" fill="url(#bodyGrad)" stroke="#c8d5e1" stroke-width="2.5"/>
          <ellipse cx="386" cy="254" rx="32" ry="40" fill="#ffffff" opacity=".65"/>
          <!-- 收拢的翅膀 -->
          <path d="M348 196 C400 192 428 226 426 268 C416 298 372 300 350 280 C332 250 332 214 348 196 Z"
                fill="#e9f1f7" stroke="#c2d0dd" stroke-width="2"/>
          <path d="M358 236 Q388 246 418 244" fill="none" stroke="#c2d0dd" stroke-width="1.8"/>
          <path d="M356 256 Q386 268 412 262" fill="none" stroke="#c2d0dd" stroke-width="1.8"/>
        </g>

        <!-- ===== 扶车把的翅膀（保持固定，握住车把） ===== -->
        <path d="M398 206 C480 214 566 240 660 255" fill="none" stroke="#cdd9e4" stroke-width="20" stroke-linecap="round"/>
        <path d="M398 206 C480 214 566 240 660 255" fill="none" stroke="#fbfdff" stroke-width="14" stroke-linecap="round"/>
        <!-- 爪尖扣住车把 -->
        <g stroke="#ef9a2c" stroke-width="3.6" stroke-linecap="round" fill="none">
          <path d="M668 252 q6 4 2 10"/>
          <path d="M674 254 q6 5 1 11"/>
          <path d="M662 250 q5 4 1 9"/>
        </g>

        <!-- ===== 脖子与头（轻微点头） ===== -->
        <g>
          <animateTransform attributeName="transform" type="rotate"
            values="-1.6 406 196;1.8 406 196;-1.6 406 196" keyTimes="0;.5;1" dur="2.2s" repeatCount="indefinite"/>
          <!-- 脖子 -->
          <path d="M396 214 C398 168 432 146 472 150" fill="none" stroke="#c8d5e1" stroke-width="34" stroke-linecap="round"/>
          <path d="M396 214 C398 168 432 146 472 150" fill="none" stroke="#fbfdff" stroke-width="28" stroke-linecap="round"/>
          <!-- 头顶小冠羽 -->
          <g stroke="#c8d5e1" stroke-width="2.6" stroke-linecap="round">
            <line x1="470" y1="128" x2="460" y2="114"/>
            <line x1="478" y1="126" x2="474" y2="110"/>
            <line x1="486" y1="127" x2="490" y2="112"/>
          </g>
          <!-- 头部 -->
          <path d="M462 152 C462 128 496 122 510 138 C516 150 508 162 488 162 C472 162 462 160 462 152 Z"
                fill="url(#bodyGrad)" stroke="#c8d5e1" stroke-width="2.5"/>
          <!-- 上喙 -->
          <path d="M506 138 C548 140 588 150 614 159 C602 167 560 160 508 154 Z"
                fill="#f29a2e" stroke="#d67f1b" stroke-width="2" stroke-linejoin="round"/>
          <!-- 喉囊 / 下喙 -->
          <path d="M508 152 C548 158 588 160 610 169 C598 198 540 199 510 170 C505 162 505 156 508 152 Z"
                fill="url(#pouchGrad)" stroke="#e0841f" stroke-width="2" stroke-linejoin="round" opacity=".96"/>
          <!-- 眼睛 -->
          <circle cx="492" cy="138" r="6.6" fill="#ffffff" stroke="#b9c6d3" stroke-width="1.6"/>
          <circle cx="494.4" cy="138" r="3.3" fill="#2b313b"/>
          <circle cx="492.8" cy="136.4" r="1.3" fill="#ffffff"/>
          <path d="M483 130 Q493 124.5 504 130" fill="none" stroke="#b9c6d3" stroke-width="2" stroke-linecap="round"/>
        </g>

        <!-- ===== 被风吹动的红围巾 ===== -->
        <g>
          <animateTransform attributeName="transform" type="rotate"
            values="-7 406 192;7 406 192;-7 406 192" keyTimes="0;.5;1" dur=".46s" repeatCount="indefinite"/>
          <path d="M414 184 Q384 176 348 190 Q372 198 344 210 Q372 206 408 202 Z" fill="#e0524b" stroke="#c63d37" stroke-width="1.6"/>
          <line x1="386" y1="188" x2="372" y2="196" stroke="#c63d37" stroke-width="2"/>
          <line x1="366" y1="196" x2="352" y2="202" stroke="#c63d37" stroke-width="2"/>
        </g>
        <g>
          <animateTransform attributeName="transform" type="rotate"
            values="8 404 200;-6 404 200;8 404 200" keyTimes="0;.5;1" dur=".6s" repeatCount="indefinite"/>
          <path d="M410 198 Q376 196 342 214 Q374 218 406 214 Z" fill="#ef6a5e" stroke="#c63d37" stroke-width="1.4"/>
        </g>
        <!-- 围脖 -->
        <ellipse cx="406" cy="194" rx="13" ry="9" fill="#d4473f" stroke="#c63d37" stroke-width="1.6"/>
      </svg>
    </div>

    <footer class="stage-foot">
      <span>车轮、曲柄、双腿、围巾、路面与云层均为循环 SMIL 动画</span>
      <button id="toggleBtn" type="button">暂停</button>
    </footer>
  </main>

<script>
  (function () {
    var svg = document.getElementById('scene');
    var btn = document.getElementById('toggleBtn');
    var paused = false;
    btn.addEventListener('click', function () {
      if (!paused) {
        svg.pauseAnimations();
        btn.textContent = '继续';
      } else {
        svg.unpauseAnimations();
        btn.textContent = '暂停';
      }
      paused = !paused;
    });
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      svg.pauseAnimations();
      btn.textContent = '继续';
      paused = true;
    }
  })();
</script>
</body>
</html>
