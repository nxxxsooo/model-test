<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 - SVG 2D动画</title>
<style>
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#0f172a; font-family:system-ui,sans-serif; color:#e2e8f0; }
  h1 { font-size:20px; font-weight:600; margin:18px 0 10px; letter-spacing:.05em; }
  p { margin:0 0 14px; font-size:13px; color:#94a3b8; }
  .stage { width:min(900px,94vw); border-radius:16px; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,.5); border:1px solid #334155; }
  svg { display:block; width:100%; height:auto; background:linear-gradient(#7dd3fc 0%, #bae6fd 55%, #dcfce7 55%, #bbf7d0 100%); }
  .cloud { animation: drift linear infinite; }
  .c1 { animation-duration:22s; } .c2 { animation-duration:34s; } .c3 { animation-duration:27s; }
  @keyframes drift { from { transform:translateX(900px);} to { transform:translateX(-250px);} }
  .bush-move { animation: roll linear infinite; }
  @keyframes roll { from { transform:translateX(0);} to { transform:translateX(-400px);} }
  .dash { animation: dashmove .6s linear infinite; }
  @keyframes dashmove { to { stroke-dashoffset:-40; } }
  .bob { animation: bob .5s ease-in-out infinite alternate; }
  @keyframes bob { from { transform:translateY(-3px);} to { transform:translateY(4px);} }
</style>
</head>
<body>
<h1>鹈鹕骑自行车 🚲 SVG 2D 动画</h1>
<p>纯 SVG + SMIL + JS：车轮转 · 脚踏踩 · 翅膀扇 · 背景走</p>
<div class="stage">
<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="sunG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fefce8"/><stop offset="60%" stop-color="#fde047"/><stop offset="100%" stop-color="#f59e0b"/>
    </radialGradient>
  </defs>

  <!-- 太阳 -->
  <circle cx="680" cy="80" r="42" fill="url(#sunG)"/>

  <!-- 云 -->
  <g class="cloud c1" opacity=".95"><g transform="translate(0,70)" fill="white"><ellipse cx="0" cy="0" rx="42" ry="22"/><ellipse cx="32" cy="-10" rx="30" ry="20"/><ellipse cx="-32" cy="-6" rx="26" ry="16"/></g></g>
  <g class="cloud c2" opacity=".9"><g transform="translate(0,130)" fill="white"><ellipse cx="0" cy="0" rx="34" ry="17"/><ellipse cx="26" cy="-8" rx="24" ry="15"/></g></g>
  <g class="cloud c3" opacity=".85"><g transform="translate(0,45)" fill="white"><ellipse cx="0" cy="0" rx="28" ry="14"/><ellipse cx="20" cy="-6" rx="20" ry="12"/></g></g>

  <!-- 远山 -->
  <path d="M0,300 Q120,220 240,285 T480,280 T800,290 L800,340 L0,340 Z" fill="#86efac"/>
  <path d="M0,320 Q200,270 400,315 T800,310 L800,350 L0,350 Z" fill="#4ade80"/>

  <!-- 路 -->
  <rect x="0" y="380" width="800" height="100" fill="#475569"/>
  <rect x="0" y="380" width="800" height="10" fill="#64748b"/>
  <line x1="0" y1="432" x2="800" y2="432" stroke="white" stroke-width="6" stroke-dasharray="28 22" class="dash"/>

  <!-- 移动的灌木/小树 -->
  <g class="bush-move">
    <g id="bushes">
      <g transform="translate(50,360)"><rect x="-4" y="-25" width="8" height="25" fill="#92400e"/><circle cx="0" cy="-35" r="20" fill="#16a34a"/><circle cx="-14" cy="-28" r="13" fill="#22c55e"/></g>
      <g transform="translate(250,365)"><rect x="-4" y="-20" width="8" height="20" fill="#92400e"/><circle cx="0" cy="-28" r="15" fill="#15803d"/></g>
      <g transform="translate(450,360)"><rect x="-4" y="-25" width="8" height="25" fill="#92400e"/><circle cx="0" cy="-35" r="20" fill="#16a34a"/><circle cx="14" cy="-28" r="13" fill="#22c55e"/></g>
      <g transform="translate(650,365)"><rect x="-4" y="-20" width="8" height="20" fill="#92400e"/><circle cx="0" cy="-28" r="15" fill="#15803d"/></g>
      <g transform="translate(850,360)"><rect x="-4" y="-25" width="8" height="25" fill="#92400e"/><circle cx="0" cy="-35" r="20" fill="#16a34a"/><circle cx="-14" cy="-28" r="13" fill="#22c55e"/></g>
    </g>
  </g>

  <!-- 自行车 + 鹈鹕整体 -->
  <g>
    <!-- 后轮 -->
    <g>
      <circle cx="270" cy="380" r="62" fill="none" stroke="#0f172a" stroke-width="10"/>
      <circle cx="270" cy="380" r="62" fill="none" stroke="#94a3b8" stroke-width="2"/>
      <g stroke="#cbd5e1" stroke-width="2">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0 270 380" to="360 270 380" dur="0.7s" repeatCount="indefinite"/>
          <line x1="270" y1="380" x2="270" y2="322"/><line x1="270" y1="380" x2="270" y2="438"/>
          <line x1="270" y1="380" x2="212" y2="380"/><line x1="270" y1="380" x2="328" y2="380"/>
          <line x1="270" y1="380" x2="229" y2="339"/><line x1="270" y1="380" x2="311" y2="421"/>
          <line x1="270" y1="380" x2="311" y2="339"/><line x1="270" y1="380" x2="229" y2="421"/>
        </g>
      </g>
      <circle cx="270" cy="380" r="8" fill="#334155"/>
    </g>
    <!-- 前轮 -->
    <g>
      <circle cx="540" cy="380" r="62" fill="none" stroke="#0f172a" stroke-width="10"/>
      <circle cx="540" cy="380" r="62" fill="none" stroke="#94a3b8" stroke-width="2"/>
      <g stroke="#cbd5e1" stroke-width="2">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0 540 380" to="360 540 380" dur="0.7s" repeatCount="indefinite"/>
          <line x1="540" y1="380" x2="540" y2="322"/><line x1="540" y1="380" x2="540" y2="438"/>
          <line x1="540" y1="380" x2="482" y2="380"/><line x1="540" y1="380" x2="598" y2="380"/>
          <line x1="540" y1="380" x2="499" y2="339"/><line x1="540" y1="380" x2="581" y2="421"/>
          <line x1="540" y1="380" x2="581" y2="339"/><line x1="540" y1="380" x2="499" y2="421"/>
        </g>
      </g>
      <circle cx="540" cy="380" r="8" fill="#334155"/>
    </g>

    <!-- 车架 -->
    <g stroke="#1e293b" stroke-width="7" stroke-linecap="round" fill="none">
      <line x1="270" y1="380" x2="400" y2="380"/>
      <line x1="270" y1="380" x2="350" y2="292"/>
      <line x1="350" y1="292" x2="400" y2="380"/>
      <line x1="400" y1="380" x2="525" y2="322"/>
      <line x1="350" y1="292" x2="500" y2="272"/>
      <line x1="500" y1="272" x2="525" y2="322"/>
      <line x1="525" y1="322" x2="540" y2="380"/>
    </g>
    <!-- 座垫 / 车把 -->
    <rect x="322" y="276" width="56" height="14" rx="7" fill="#0f172a"/>
    <line x1="500" y1="272" x2="516" y2="248" stroke="#1e293b" stroke-width="7" stroke-linecap="round"/>
    <line x1="504" y1="248" x2="524" y2="248" stroke="#0f172a" stroke-width="7" stroke-linecap="round"/>

    <!-- 脚踏曲柄 (JS驱动, 与腿同步) -->
    <line id="crank1" x1="400" y1="380" x2="425" y2="380" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>
    <line id="crank2" x1="400" y1="380" x2="375" y2="380" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>
    <circle cx="400" cy="380" r="10" fill="#64748b" stroke="#0f172a" stroke-width="3"/>
    <rect id="pedal1" x="-12" y="-5" width="24" height="10" rx="3" fill="#0f172a"/>
    <rect id="pedal2" x="-12" y="-5" width="24" height="10" rx="3" fill="#0f172a"/>

    <!-- 鹈鹕 (整体上下浮动) -->
    <g id="pelican">
      <!-- 尾巴 -->
      <polygon points="308,225 262,205 270,238 268,252 310,245" fill="#475569"/>
      <!-- 腿 (JS更新 x2,y2) -->
      <line id="legFar" x1="375" y1="275" x2="400" y2="380" stroke="#f59e0b" stroke-width="7" stroke-linecap="round"/>
      <line id="legNear" x1="395" y1="278" x2="400" y2="380" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
      <!-- 身体 -->
      <ellipse cx="380" cy="228" rx="82" ry="56" fill="#f8fafc" stroke="#334155" stroke-width="4"/>
      <ellipse cx="380" cy="240" rx="55" ry="34" fill="#e2e8f0"/>
      <!-- 翅膀 -->
      <g id="wing">
        <ellipse cx="365" cy="235" rx="48" ry="26" fill="white" stroke="#334155" stroke-width="3" transform="rotate(-15 365 235)"/>
        <path d="M330,240 l-28,10 l26,8 l-24,12 l30,6" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <!-- 脖子 -->
      <path d="M435,205 C465,190 472,165 460,138" fill="none" stroke="#334155" stroke-width="34" stroke-linecap="round"/>
      <path d="M435,205 C465,190 472,165 460,138" fill="none" stroke="#f8fafc" stroke-width="26" stroke-linecap="round"/>
      <!-- 头 -->
      <circle cx="459" cy="130" r="29" fill="#f8fafc" stroke="#334155" stroke-width="3"/>
      <path d="M445,108 q8,-14 18,-4" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
      <!-- 眼睛 -->
      <circle cx="466" cy="124" r="7" fill="white" stroke="#334155" stroke-width="2"/>
      <circle id="eye" cx="468" cy="124" r="3.2" fill="#0f172a"/>
      <circle cx="469" cy="123" r="1" fill="white"/>
      <!-- 嘴: 上喙 + 喉囊 -->
      <polygon points="484,118 588,142 484,142" fill="#fb923c" stroke="#9a3412" stroke-width="3" stroke-linejoin="round"/>
      <path id="pouch" d="M486,142 L584,142 Q560,178 520,174 Q495,170 486,142 Z" fill="#fdba74" stroke="#9a3412" stroke-width="3"/>
      <line x1="484" y1="142" x2="588" y2="142" stroke="#9a3412" stroke-width="2"/>
      <!-- 脸红 -->
      <ellipse cx="452" cy="138" rx="7" ry="5" fill="#fecdd3" opacity=".9"/>
      <!-- 脚蹼 -->
      <ellipse id="footFar" cx="400" cy="380" rx="14" ry="7" fill="#f59e0b" stroke="#9a3412" stroke-width="2"/>
      <ellipse id="footNear" cx="400" cy="380" rx="15" ry="8" fill="#fbbf24" stroke="#9a3412" stroke-width="2"/>
      <!-- 翅膀前臂抓车把 -->
      <path d="M420,230 Q465,250 505,252" fill="none" stroke="#f8fafc" stroke-width="18" stroke-linecap="round"/>
      <path d="M420,230 Q465,250 505,252" fill="none" stroke="#334155" stroke-width="18" stroke-linecap="round" stroke-dasharray="0 100" opacity=".25"/>
      <circle cx="510" cy="252" r="9" fill="#f8fafc" stroke="#334155" stroke-width="3"/>
    </g>
  </g>

  <!-- 速度线 -->
  <g stroke="white" stroke-width="4" stroke-linecap="round" opacity=".7">
    <line x1="60" y1="200" x2="130" y2="200"><animate attributeName="x1" values="180;40" dur=".7s" repeatCount="indefinite"/><animate attributeName="x2" values="250;110" dur=".7s" repeatCount="indefinite"/></line>
    <line x1="40" y1="250" x2="100" y2="250"><animate attributeName="x1" values="160;20" dur=".55s" repeatCount="indefinite"/><animate attributeName="x2" values="220;80" dur=".55s" repeatCount="indefinite"/></line>
    <line x1="80" y1="300" x2="150" y2="300"><animate attributeName="x1" values="200;60" dur=".8s" repeatCount="indefinite"/><animate attributeName="x2" values="270;130" dur=".8s" repeatCount="indefinite"/></line>
  </g>
</svg>
</div>

<script>
const BB = {x:400, y:380}, R = 26;
const $ = id => document.getElementById(id);
const pelican=$('pelican'), wing=$('wing'), pouch=$('pouch'), eye=$('eye');
let t = 0;
function frame(){
  t += 0.09;                       // 踩踏速度
  const a = t * 2.2;                // 曲柄角度
  const p1 = { x: BB.x + R*Math.cos(a), y: BB.y + R*Math.sin(a) };
  const p2 = { x: BB.x - R*Math.cos(a), y: BB.y - R*Math.sin(a) };
  const bob = Math.sin(a*2)*4;      // 身体起伏, 踩两下一起伏

  pelican.setAttribute('transform', `translate(0 ${bob})`);

  // 曲柄 + 脚踏
  $('crank1').setAttribute('x2', p1.x); $('crank1').setAttribute('y2', p1.y);
  $('crank2').setAttribute('x2', p2.x); $('crank2').setAttribute('y2', p2.y);
  $('pedal1').setAttribute('transform', `translate(${p1.x} ${p1.y})`);
  $('pedal2').setAttribute('transform', `translate(${p2.x} ${p2.y})`);

  // 腿: 髋部随身体浮动, 脚跟脚踏走
  const hipFar = {x:372, y:276+bob}, hipNear = {x:396, y:278+bob};
  for (const [leg,hip,p] of [['legFar',hipFar,p2],['legNear',hipNear,p1]]){
    $(leg).setAttribute('x1',hip.x); $(leg).setAttribute('y1',hip.y);
    $(leg).setAttribute('x2',p.x); $(leg).setAttribute('y2',p.y-4);
  }
  $('footFar').setAttribute('cx',p2.x+4); $('footFar').setAttribute('cy',p2.y-4);
  $('footNear').setAttribute('cx',p1.x+4); $('footNear').setAttribute('cy',p1.y-4);

  // 翅膀轻扇 + 喉囊抖 + 眼睛看前方微动
  wing.setAttribute('transform', `rotate(${Math.sin(t*3)*10-6} 365 235)`);
  pouch.setAttribute('transform', `translate(0 ${Math.abs(Math.sin(a))*3})`);
  eye.setAttribute('cx', 468 + Math.sin(t*1.5)*1.2);
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
