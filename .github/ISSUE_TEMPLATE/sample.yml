name: 投一个样例
description: 提交某个模型在某道题上的真实产出
title: "[sample] 题目"
labels: ["sample"]
body:
  - type: markdown
    attributes:
      value: |
        本站不给结论，只陈列产出。你怎么看写在「你的观察」里就行，不用纠结算不算「降智」。

        合并后作品会存进仓库 `results/`，在题目页直接可看，不依赖外链。

  - type: input
    id: test
    attributes:
      label: 题目
      description: |
        从站点复制过来的会自动填好。手动填请从下列中抄一条：
        `鹈鹕骑自行车 (pelican-bike)` / `孙悟空开飞机 (wukong-plane)` /
        `秦始皇骑北极熊 (qinshihuang-bear)` /
        `三合一省 token 版（鹈鹕×孙悟空×秦始皇） (trilogy-token-saving)` /
        `糖果逻辑题（答案应为 21） (candy-logic)`
      placeholder: 鹈鹕骑自行车 (pelican-bike)
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: 模型
      description: 写清版本，例如 Gemini 3.8 Flash、Claude Opus 5
      placeholder: Gemini 3.8 Flash
    validations:
      required: true

  - type: input
    id: channel
    attributes:
      label: 渠道
      description: 在哪里跑的，例如 OpenCode 2、官方网页版、API
      placeholder: OpenCode 2

  - type: input
    id: date
    attributes:
      label: 测试日期
      placeholder: "2026-09-17"
    validations:
      required: true

  - type: textarea
    id: link
    attributes:
      label: 产出
      description: |
        二选一：贴 Gist / CodePen 链接，或者直接把完整 HTML 代码贴在下面的代码块里。
        代码会被原样存进仓库，所以请贴完整可运行的单文件。
      placeholder: |
        https://gist.github.com/...

        或者：

        ```html
        <!DOCTYPE html>
        ...
        ```
    validations:
      required: true

  - type: textarea
    id: note
    attributes:
      label: 你的观察
      description: 你觉得哪里好、哪里崩了。具体比结论有用——说清楚是哪个部位怎么不对。
      placeholder: 腿是单段直线，没有膝盖折点，脚和踏板脱开了。
