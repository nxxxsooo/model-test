<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>作品 · 降智测试题集</title>
  <link rel="icon" href="favicon.svg">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="work.css">
</head>
<body class="work-page">
  <header class="work-header">
    <div class="work-nav-left">
      <a id="work-back" class="work-back" href="./#/" aria-label="返回题目，查看其他样例">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m12 5-7 7 7 7M5 12h15"/></svg>
        <span>返回题目</span>
      </a>
    </div>

    <div class="work-identity">
      <div class="work-switcher" role="group" aria-label="切换同题模型作品">
        <button id="work-prev" class="btn secondary btn-sm work-step-btn" type="button" disabled title="上一个同题样例">← 上一个</button>
        <div class="work-select-wrap">
          <h1 id="work-model" class="sr-only">作品查看</h1>
          <select id="work-select" class="work-select" aria-label="选择同题模型作品" disabled>
            <option>作品查看</option>
          </select>
        </div>
        <button id="work-next" class="btn secondary btn-sm work-step-btn" type="button" disabled title="下一个同题样例">下一个 →</button>
      </div>
      <p id="work-meta" class="meta">降智测试题集</p>
    </div>

    <div class="work-actions-right">
      <button id="work-reload" class="btn secondary btn-sm" type="button" disabled title="重新加载当前作品">↺ 重载</button>
      <button id="note-open" class="btn secondary btn-sm" type="button" aria-haspopup="dialog" disabled>观察与检查点</button>
      <button id="prompt-open" class="btn secondary btn-sm" type="button" aria-haspopup="dialog" disabled>原始提示词</button>
    </div>
  </header>

  <main id="work-stage" class="work-stage" aria-label="原始作品">
    <div id="work-status" class="work-status" role="status">正在载入作品…</div>
    <noscript><p class="work-status">请启用 JavaScript 查看作品，或<a href="./#/">返回题目集</a>。</p></noscript>
  </main>

  <dialog id="note-dialog" class="prompt-dialog" aria-labelledby="note-title" aria-describedby="note-context">
    <div class="prompt-heading">
      <h2 id="note-title">贡献者观察与检查点</h2>
      <button id="note-close" class="text-button" type="button" autofocus>关闭<span class="escape-hint" aria-hidden="true"> Esc</span></button>
    </div>
    <p id="note-context" class="meta"></p>
    <div id="work-note-body" class="work-note-body"></div>
  </dialog>

  <dialog id="prompt-dialog" class="prompt-dialog" aria-labelledby="prompt-title" aria-describedby="prompt-context">
    <div class="prompt-heading">
      <h2 id="prompt-title">原始提示词</h2>
      <button id="prompt-close" class="text-button" type="button" autofocus>关闭<span class="escape-hint" aria-hidden="true"> Esc</span></button>
    </div>
    <p id="prompt-context" class="meta"></p>
    <pre id="work-prompt" tabindex="0"></pre>
    <div class="prompt-footer">
      <a id="prompt-related" class="text-link" href="./#/">查看同题其他样例</a>
      <button id="prompt-copy" class="btn btn-sm" type="button">复制提示词</button>
    </div>
    <p id="copy-status" class="copy-status meta" role="status" aria-live="polite"></p>
  </dialog>

  <script src="data/config.js"></script>
  <script src="data/tests.js"></script>
  <script src="data/samples.js"></script>
  <script src="work.js"></script>
</body>
</html>
